name: Onlive store UI cleanup

on:
  push:
    paths:
      - '.github/workflows/onlive-store-ui-cleanup.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch MainApp and Root
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/MainApp.tsx')
          s = p.read_text()
          old = '''<TouchableOpacity onPress={signOut} style={s.logout}><Ionicons name="log-out-outline" size={20} color="#fff"/></TouchableOpacity>'''
          assert old in s, 'Header logout button not found'
          s = s.replace(old, '', 1)
          s = s.replace("statusWrap:{width:145}", "statusWrap:{width:112,marginLeft:'auto'}", 1)
          s = s.replace("statusOn:{height:40,borderRadius:16,alignItems:'center',justifyContent:'center'}", "statusOn:{height:34,borderRadius:14,alignItems:'center',justifyContent:'center'}", 1)
          s = s.replace("statusOff:{height:40,borderRadius:16,backgroundColor:'#303039',alignItems:'center',justifyContent:'center'}", "statusOff:{height:34,borderRadius:14,backgroundColor:'#303039',alignItems:'center',justifyContent:'center'}", 1)
          s = s.replace("statusOnText:{fontSize:13,fontWeight:'900',color:'#fff'}", "statusOnText:{fontSize:11,fontWeight:'900',color:'#fff'}", 1)
          s = s.replace("statusOffText:{fontSize:12,fontWeight:'900',color:'#8b8b93'}", "statusOffText:{fontSize:11,fontWeight:'900',color:'#8b8b93'}", 1)
          p.write_text(s)

          p = Path('src/Root.tsx')
          s = p.read_text()
          marker = " const openDiscussions=()=>{setChatTarget(null);setNotificationRoomId(null);setMode('chat')};"
          assert marker in s, 'Root function insertion point not found'
          signout = " const performSignOut=async()=>{if(deleteLoading)return;try{await supabase.auth.signOut();}catch{}setAccountOpen(false);setUserId(null);setUnreadCount(0);setChatTarget(null);setNotificationRoomId(null);setAppSection('home');setMode('app');setAppBadge(0)};\n"
          s = s.replace(marker, signout + marker, 1)
          old_main = "<MainApp initialScreen={appSection} onOpenDiscussions={openDiscussions} onStartChat={startChat} onOpenAccount={()=>setAccountOpen(true)} unreadCount={unreadCount}/>"
          new_main = "<MainApp key={userId||'guest'} initialScreen={appSection} onOpenDiscussions={openDiscussions} onStartChat={startChat} onOpenAccount={()=>setAccountOpen(true)} unreadCount={unreadCount}/>"
          assert old_main in s, 'MainApp render not found'
          s = s.replace(old_main, new_main, 1)
          privacy = "<TouchableOpacity onPress={()=>Linking.openURL('https://onlive-app.com/privacy')} style={s.accountRow}><View style={s.accountRowIcon}><Ionicons name=\"shield-checkmark-outline\" size={20} color=\"#6b2cff\"/></View><View style={{flex:1}}><Text style={s.accountRowTitle}>Confidentialité</Text><Text style={s.accountRowText}>Consulter la politique de confidentialité</Text></View><Ionicons name=\"chevron-forward\" size={19} color=\"#999\"/></TouchableOpacity>"
          assert privacy in s, 'Privacy account row not found'
          logout = privacy + "<TouchableOpacity onPress={performSignOut} style={s.accountRow}><View style={s.accountRowIcon}><Ionicons name=\"log-out-outline\" size={20} color=\"#6b2cff\"/></View><View style={{flex:1}}><Text style={s.accountRowTitle}>Déconnexion</Text><Text style={s.accountRowText}>Se déconnecter de ce téléphone</Text></View><Ionicons name=\"chevron-forward\" size={19} color=\"#999\"/></TouchableOpacity>"
          s = s.replace(privacy, logout, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "onlive-bot"
          git config user.email "noreply@onlive-app.com"
          git add src/MainApp.tsx src/Root.tsx
          git commit -m "Move logout into account and refine live badge"
          git push origin HEAD:main

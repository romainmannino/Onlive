name: Quick Onlive UI tweak

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quick-ui-tweak.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch MainApp only
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/MainApp.tsx')
          s=p.read_text()
          old1='style={s.favoriteTopButton}><Ionicons name={favorites.length?\'star\':\'star-outline\'} size={26} color={favorites.length?\'#FFD43B\':\'#111111\'}/>'
          new1='style={s.favoriteTopButton}><Ionicons name={favorites.length?\'star\':\'star-outline\'} size={22} color={favorites.length?\'#FFD43B\':\'#111111\'}/>'
          if old1 in s:
            s=s.replace(old1,new1,1)
          elif 'size={22} color={favorites.length?\'#FFD43B\':\'#111111\'}' not in s:
            raise SystemExit('favorite star anchor not found')

          old2="programTopRight:{alignItems:'flex-end',gap:5}"
          new2="programTopRight:{flexDirection:'row',alignItems:'center',gap:5}"
          if old2 in s:
            s=s.replace(old2,new2,1)
          elif new2 not in s:
            raise SystemExit('viewer alignment anchor not found')

          p.write_text(s)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MainApp.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Reduce favorite star and align viewer badge"
          git push

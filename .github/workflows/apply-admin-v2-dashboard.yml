name: Apply admin v2 dashboard

on:
  push:
    paths:
      - '.github/workflows/apply-admin-v2-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject admin v2 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/admin.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="/admin-v2.css">'
          js='<script src="/admin-v2.js"></script>'
          if css not in s:
              s=s.replace('</head>',css+'</head>',1)
          if js not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit integration
        run: |
          if git diff --quiet; then echo 'Already integrated'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/admin.html
          git commit -m 'Enable redesigned dynamic admin dashboard'
          git push
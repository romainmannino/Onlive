name: Priority prime-time selection
on:
  push:
    paths:
      - '.github/workflows/prime-time-selection.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch priority daily selection
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/MainApp.tsx')
          s=p.read_text()
          new="const featuredPrograms=useMemo(()=>{const norm=(v='')=>String(v).toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');const mins=(p:Program)=>{const[h,m]=String(p.time||'00:00').split(':').map(Number);return h*60+(m||0)};const bucket=(p:Program)=>{const c=norm(p.category),t=norm(p.title);if(/sport|foot|football|cecifoot|tennis|rugby|basket|handball|volley|golf|cycl|athlet|natation|mma|boxe|kick-boxing|f1|moto/.test(c+' '+t))return'sport';if(/film|serie|fiction|telefilm/.test(c))return'fiction';if(/divertissement|magazine|reality|tele-realite|jeu|variete|talk/.test(c))return'entertainment';return'other'};const score=(p:Program)=>{const c=norm(p.channel),t=norm(p.title),m=mins(p);let s=0;if(m>=19*60+30&&m<=22*60+30)s+=28;else if(m>=18*60)s+=10;if((p as any).isLive||(p as any).is_live)s+=18;if(c.includes('tf1'))s+=32;else if(c.includes('france 2'))s+=27;else if(c.includes('m6'))s+=26;else if(c.includes('canal'))s+=24;else if(c.includes('france 3'))s+=20;else if(c.includes('arte'))s+=13;else if(c.includes('tmc')||c.includes('w9'))s+=12;else if(c.includes('equipe')||c.includes('bein')||c.includes('ligue 1')||c.includes('rmc sport'))s+=18;if(/ligue 1|psg|paris saint|marseille|\\bom\\b|equipe de france|champions league|ligue des champions/.test(t+' '+c))s+=60;else if(/premier league|arsenal|real madrid|barcelone|barcelona|liverpool|bayern|monaco/.test(t))s+=32;if(/finale|demi-finale|quart|derby|classico|choc|grand prix|masters|grand chelem|championnat du monde|euro|coupe du monde/.test(t))s+=18;if(/koh-lanta|the voice|star academy|danse avec les stars|mask singer|top chef|amour est dans le pre|pekin express|incroyable talent|fort boyard|secret story|12 coups|capital|zone interdite/.test(t))s+=24;if(/inedit|premiere|finale|special/.test(t))s+=10;return s};const candidates=programs.filter(p=>programState(p,now)!=='expired'&&mins(p)>=18*60&&mins(p)<=23*60+30);const ranked=[...candidates].sort((a,b)=>score(b)-score(a)||String(a.time).localeCompare(String(b.time)));const editorial=[...candidates].filter(p=>(p as any).featured).sort((a,b)=>{const ao=(a as any).featuredOrder??(a as any).featured_order??999;const bo=(b as any).featuredOrder??(b as any).featured_order??999;return ao-bo||score(b)-score(a)});const picks:Program[]=[];for(const p of editorial){if(picks.length>=3)break;if(!picks.some(x=>x.id===p.id))picks.push(p)}if(picks.length<3){for(const kind of ['sport','fiction','entertainment']){if(picks.length>=3)break;if(picks.some(p=>bucket(p)===kind))continue;const hit=ranked.find(p=>bucket(p)===kind&&!picks.some(x=>x.id===p.id));if(hit)picks.push(hit)}}for(const p of ranked){if(picks.length>=3)break;if(!picks.some(x=>x.id===p.id))picks.push(p)}return picks.slice(0,3)},[programs,now]);"
          pattern=r"const featuredPrograms=useMemo\(\(\)=>\{.*?\},\[programs,now(?:,selectedProgram)?\]\);"
          s2,n=re.subn(pattern,lambda _m:new,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('Could not locate featuredPrograms block')
          p.write_text(s2)

          tv=Path('src/tvPrograms.ts')
          t=tv.read_text()
          rule="  {match:/\\b(?:les )?12 coups(?: de midi)?\\b/i,image:'https://tf1pro.com/sites/default/files/styles/fiches/public/media-import/LE%20COMBAT%20DES%20MAITRES%202026.jpg?itok=3JtqVZHp'},\n"
          anchor="const PROGRAM_IMAGE_RULES: Array<{match:RegExp,image:string}> = [\n"
          if rule not in t:
              if anchor not in t:
                  raise SystemExit('Could not locate PROGRAM_IMAGE_RULES')
              t=t.replace(anchor,anchor+rule,1)
              tv.write_text(t)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MainApp.tsx src/tvPrograms.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Honor editorial highlights and keep stable programme artwork'
          git push

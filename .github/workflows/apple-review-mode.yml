name: Apple review demo mode
on:
  push:
    paths:
      - '.github/workflows/apple-review-mode.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch review mode
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/Root.tsx')
          t=p.read_text()
          t=t.replace(" const[userId,setUserId]=useState<string|null>(null);"," const[userId,setUserId]=useState<string|null>(null);\n const[reviewMode,setReviewMode]=useState(false);\n const[reviewProgram,setReviewProgram]=useState<{id:string;title:string;channel:string}|null>(null);",1)
          t=t.replace("supabase.auth.getSession().then(({data})=>setUserId(data.session?.user.id||null));","supabase.auth.getSession().then(({data})=>{setUserId(data.session?.user.id||null);setReviewMode((data.session?.user.email||'').toLowerCase()==='review@onlive-app.com')});",1)
          t=t.replace("const{data:l}=supabase.auth.onAuthStateChange((event,s)=>{setUserId(s?.user.id||null);if(event==='PASSWORD_RECOVERY')setResetOpen(true)});","const{data:l}=supabase.auth.onAuthStateChange((event,s)=>{setUserId(s?.user.id||null);setReviewMode((s?.user.email||'').toLowerCase()==='review@onlive-app.com');if(event==='PASSWORD_RECOVERY')setResetOpen(true)});",1)
          old="const startChat=async(target:ChatTarget)=>{if(!userId||!target.programId)return Alert.alert('Discussion indisponible','Tu dois être Onlive sur le même programme que ton proche pour discuter.');"
          new="const startChat=async(target:ChatTarget)=>{if(reviewMode&&target.userId.startsWith('review-demo-')){setProfileOpenSignal(0);setNotificationRoomId(null);setChatTarget(target);setMode('chat');return}if(!userId||!target.programId)return Alert.alert('Discussion indisponible','Tu dois être Onlive sur le même programme que ton proche pour discuter.');"
          if old not in t: raise SystemExit('Root startChat anchor missing')
          t=t.replace(old,new,1)
          old="if(mode==='chat'&&userId)return<ChatScreen userId={userId} initialTarget={chatTarget} initialRoomId={notificationRoomId} unreadCount={unreadCount} onUnreadChange={setUnreadCount} onBack={goHome} onHome={goHome} onContacts={goContacts} onProfile={openProfile} profileAvatar={navAvatar} profileInitials={navInitials}/>;"
          new="if(mode==='chat'&&userId)return<ChatScreen userId={userId} initialTarget={chatTarget} initialRoomId={notificationRoomId} unreadCount={unreadCount} onUnreadChange={setUnreadCount} onBack={goHome} onHome={goHome} onContacts={goContacts} onProfile={openProfile} profileAvatar={navAvatar} profileInitials={navInitials} reviewMode={reviewMode} reviewProgram={reviewProgram}/>;"
          if old not in t: raise SystemExit('Root chat anchor missing')
          t=t.replace(old,new,1)
          old="<MainApp key={userId||'guest'} initialScreen={appSection} onOpenDiscussions={openDiscussions} onStartChat={startChat} onOpenAccount={()=>setAccountOpen(true)} profileOpenSignal={profileOpenSignal} unreadCount={unreadCount}/>"
          new="<MainApp key={userId||'guest'} initialScreen={appSection} onOpenDiscussions={openDiscussions} onStartChat={startChat} onOpenAccount={()=>setAccountOpen(true)} profileOpenSignal={profileOpenSignal} unreadCount={unreadCount} reviewMode={reviewMode} onReviewProgramChange={setReviewProgram}/>"
          if old not in t: raise SystemExit('Root app anchor missing')
          t=t.replace(old,new,1)
          p.write_text(t)

          p=Path('src/MainApp.tsx')
          t=p.read_text()
          t=t.replace("const PROGRAMS_CACHE_KEY='@onlive/tv-programs-cache';","const PROGRAMS_CACHE_KEY='@onlive/tv-programs-cache';\nconst REVIEW_EMAIL='review@onlive-app.com';\nconst reviewTime=()=>{const d=new Date(Date.now()-10*60000);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};\nconst reviewPrograms=()=>FALLBACK_PROGRAMS.slice(0,3).map((p,i)=>({...p,id:`review-program-${i+1}`,time:reviewTime(),isLive:true}));",1)
          old="export default function MainApp({onOpenDiscussions,onStartChat,onOpenAccount,profileOpenSignal=0,unreadCount=0,initialScreen='home'}:{onOpenDiscussions?:()=>void;onStartChat?:(target:ChatTarget)=>void;onOpenAccount?:()=>void;profileOpenSignal?:number;unreadCount?:number;initialScreen?:'home'|'contacts'}){"
          new="export default function MainApp({onOpenDiscussions,onStartChat,onOpenAccount,profileOpenSignal=0,unreadCount=0,initialScreen='home',reviewMode=false,onReviewProgramChange}:{onOpenDiscussions?:()=>void;onStartChat?:(target:ChatTarget)=>void;onOpenAccount?:()=>void;profileOpenSignal?:number;unreadCount?:number;initialScreen?:'home'|'contacts';reviewMode?:boolean;onReviewProgramChange?:(p:{id:string;title:string;channel:string}|null)=>void}){"
          if old not in t: raise SystemExit('MainApp signature anchor missing')
          t=t.replace(old,new,1)
          anchor="  useEffect(()=>{if(profileOpenSignal>0)setProfileOpen(true)},[profileOpenSignal]);"
          extra="\n  useEffect(()=>{if(!reviewMode)return;const demo:Match[]=[{userId:'review-demo-alexandre',name:'Alexandre R.',phone:'+33900000001'},{userId:'review-demo-thomas',name:'Thomas Dupont',phone:'+33900000002'},{userId:'review-demo-papa',name:'Papa',phone:'+33900000003'}];setMatches(demo);if(!programs.length)setPrograms(reviewPrograms())},[reviewMode]);"
          if anchor not in t: raise SystemExit('MainApp effect anchor missing')
          t=t.replace(anchor,anchor+extra,1)
          t=t.replace("if(!email.trim()||!password.trim()||(authMode==='register'&&!phone.trim()))return Alert.alert('Informations manquantes',authMode==='register'?'Entre ton e-mail, ton numéro et ton mot de passe.':'Entre ton e-mail et ton mot de passe.');","if(!email.trim()||!password.trim()||(authMode==='register'&&!phone.trim()&&email.trim().toLowerCase()!==REVIEW_EMAIL))return Alert.alert('Informations manquantes',authMode==='register'?'Entre ton e-mail, ton numéro et ton mot de passe.':'Entre ton e-mail et ton mot de passe.');",1)
          t=t.replace("options:{data:{phone_e164:normalizePhone(phone),display_name:fallbackName}}","options:{data:{phone_e164:email.trim().toLowerCase()===REVIEW_EMAIL?null:normalizePhone(phone),display_name:fallbackName}}",1)
          t=t.replace("phone_e164:normalizePhone(phone),updated_at:new Date().toISOString()","phone_e164:email.trim().toLowerCase()===REVIEW_EMAIL?null:normalizePhone(phone),updated_at:new Date().toISOString()",1)
          old="  async function autoLoadContacts(){const perm=await Contacts.getPermissionsAsync();if(perm.status==='granted')await loadContacts(true)}"
          new="  async function autoLoadContacts(){if(reviewMode){const demo:Match[]=[{userId:'review-demo-alexandre',name:'Alexandre R.',phone:'+33900000001'},{userId:'review-demo-thomas',name:'Thomas Dupont',phone:'+33900000002'},{userId:'review-demo-papa',name:'Papa',phone:'+33900000003'}];setMatches(demo);await refreshLiveFriends(demo);return}const perm=await Contacts.getPermissionsAsync();if(perm.status==='granted')await loadContacts(true)}"
          if old not in t: raise SystemExit('MainApp contacts anchor missing')
          t=t.replace(old,new,1)
          old="  async function refreshLiveFriends(list=matches){if(!list.length){setLiveFriends([]);return}"
          new="  async function refreshLiveFriends(list=matches){if(reviewMode){if(!selectedProgram){setLiveFriends([]);return}setLiveFriends([{...list[0],programId:selectedProgram.id,program:selectedProgram.title,channel:selectedProgram.channel,since:'depuis 12 min'},{...list[1],programId:selectedProgram.id,program:selectedProgram.title,channel:selectedProgram.channel,since:'depuis 8 min'},{...list[2],programId:selectedProgram.id,program:selectedProgram.title,channel:selectedProgram.channel,since:'depuis 4 min'}]);return}if(!list.length){setLiveFriends([]);return}"
          if old not in t: raise SystemExit('MainApp live anchor missing')
          t=t.replace(old,new,1)
          old="  async function chooseProgram(program:Program){if(!userId)return;if(programState(program)==='future')return Alert.alert('Programme à venir',`Tu pourras te mettre Onlive à partir de ${program.time}.`);if(selectedProgram?.id===program.id)return goOfflive();"
          new="  async function chooseProgram(program:Program){if(!userId)return;if(programState(program)==='future')return Alert.alert('Programme à venir',`Tu pourras te mettre Onlive à partir de ${program.time}.`);if(selectedProgram?.id===program.id)return goOfflive();if(reviewMode){setSelectedProgram(program);onReviewProgramChange?.({id:program.id,title:program.title,channel:program.channel});const demo:Match[]=[{userId:'review-demo-alexandre',name:'Alexandre R.',phone:'+33900000001'},{userId:'review-demo-thomas',name:'Thomas Dupont',phone:'+33900000002'},{userId:'review-demo-papa',name:'Papa',phone:'+33900000003'}];setLiveFriends(demo.map((m,i)=>({...m,programId:program.id,program:program.title,channel:program.channel,since:`depuis ${12-i*4} min`})));return}"
          if old not in t: raise SystemExit('MainApp choose anchor missing')
          t=t.replace(old,new,1)
          old="  async function goOfflive(){if(userId){"
          new="  async function goOfflive(){if(reviewMode){setSelectedProgram(null);setLiveFriends([]);onReviewProgramChange?.(null);return}if(userId){"
          if old not in t: raise SystemExit('MainApp off anchor missing')
          t=t.replace(old,new,1)
          old="  async function loadPrograms(){let cached:Program[]=[];"
          new="  async function loadPrograms(){if(reviewMode){try{const data=await fetchTvPrograms();const current=data.filter(p=>programState(p)!=='expired');setPrograms(current.length?current:reviewPrograms());setProgramSource(current.length?'supabase':'fallback');return}catch{setPrograms(reviewPrograms());setProgramSource('fallback');return}}let cached:Program[]=[];"
          if old not in t: raise SystemExit('MainApp load anchor missing')
          t=t.replace(old,new,1)
          p.write_text(t)

          p=Path('src/ChatScreen.tsx')
          t=p.read_text()
          t=t.replace("import{pushChatInvite}from'./notifications';","import{pushChatInvite}from'./notifications';\nimport ReviewChatScreen from'./ReviewChatScreen';",1)
          old="export default function ChatScreen({userId,initialTarget,initialRoomId,unreadCount,onUnreadChange,onBack,onHome,onContacts,onProfile,profileAvatar,profileInitials}:{userId:string;initialTarget:ChatTarget|null;initialRoomId?:string|null;unreadCount:number;onUnreadChange:(n:number)=>void;onBack:()=>void;onHome:()=>void;onContacts:()=>void;onProfile:()=>void;profileAvatar:string|null;profileInitials:string}){"
          new="export default function ChatScreen({userId,initialTarget,initialRoomId,unreadCount,onUnreadChange,onBack,onHome,onContacts,onProfile,profileAvatar,profileInitials,reviewMode=false,reviewProgram}:{userId:string;initialTarget:ChatTarget|null;initialRoomId?:string|null;unreadCount:number;onUnreadChange:(n:number)=>void;onBack:()=>void;onHome:()=>void;onContacts:()=>void;onProfile:()=>void;profileAvatar:string|null;profileInitials:string;reviewMode?:boolean;reviewProgram?:{id:string;title:string;channel:string}|null}){\n if(reviewMode)return<ReviewChatScreen initialTarget={initialTarget} reviewProgram={reviewProgram||null} onBack={onBack} onHome={onHome} onContacts={onContacts} onProfile={onProfile} profileAvatar={profileAvatar} profileInitials={profileInitials}/>;"
          if old not in t: raise SystemExit('Chat signature anchor missing')
          t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name onlive-bot
          git config user.email actions@users.noreply.github.com
          git add src/Root.tsx src/MainApp.tsx src/ChatScreen.tsx
          git commit -m "Enable isolated Apple review demo mode"
          git push

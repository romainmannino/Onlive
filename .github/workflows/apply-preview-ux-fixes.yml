name: Apply preview UX fixes

on:
  push:
    paths:
      - scripts/apply-preview-ux-fixes.js
      - .github/workflows/apply-preview-ux-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply UX fixes
        run: node scripts/apply-preview-ux-fixes.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add src/MainApp.tsx src/Root.tsx
            git commit -m "Fix preview UX, favorites and notification settings"
            git push
          fi

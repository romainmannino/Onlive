name: Polish Home Onlive heading
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-home-onlive-heading.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Patch MainApp Home typography
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/MainApp.tsx')
          s=p.read_text()
          old="<Text style={[s.introTitle,attentionFlash&&s.introTitleAttention]}>Choisis ton programme</Text>"
          new="<Text style={[s.introTitle,{fontWeight:'600'},attentionFlash&&s.introTitleAttention]}>Choisis ton programme</Text>"
          if old in s:
              s=s.replace(old,new,1)
          old="<Text style={[s.sectionTitle,s.liveSectionTitle]}>Ils sont Onlive ({liveFriends.length})</Text>"
          new="<View style={{flexDirection:'row',alignItems:'center',gap:7}}><Text style={[s.sectionTitle,s.liveSectionTitle,{fontWeight:'600'}]}>Ils sont ONLIVE</Text>{liveFriends.length>0&&<View style={{minWidth:20,height:20,paddingHorizontal:6,borderRadius:10,backgroundColor:'#ece8ff',alignItems:'center',justifyContent:'center'}}><Text style={{fontSize:10.5,fontWeight:'600',color:'#6b2cff'}}>{liveFriends.length}</Text></View>}</View>"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Commit app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MainApp.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Refine Home headings and Onlive count"
          git push

name: Fix guide visible now
on:
  push:
    paths:
      - '.github/workflows/fix-guide-visible-now.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ensure channel logo support
        run: |
          python - <<'PY'
          from pathlib import Path

          tv=Path('src/tvPrograms.ts')
          s=tv.read_text()
          marker="export const FALLBACK_PROGRAMS: Program[] = ["
          helper="""function channelLogoFallback(channel='') {\n  const c=channel.toLowerCase();\n  const domain = c.includes('france 2') ? 'france.tv' : c.includes('m6') ? 'm6.fr' : c.includes('tmc') ? 'tf1.fr' : c.includes('équipe') || c.includes('equipe') ? 'lequipe.fr' : c.includes('bein') ? 'bein.com' : c.includes('canal+') ? 'canalplus.com' : c.includes('rmc sport') ? 'rmcsport.bfmtv.com' : c.includes('6ter') ? '6play.fr' : c.includes('ligue 1+') ? 'ligue1.com' : '';\n  return domain ? `https://www.google.com/s2/favicons?domain=${domain}&sz=128` : undefined;\n}\n\n"""
          if 'function channelLogoFallback' not in s:
              s=s.replace(marker, helper+marker)
          s=s.replace("channelLogo: row.channel_logo_url || undefined,","channelLogo: row.channel_logo_url || channelLogoFallback(row.channel),")
          tv.write_text(s)

          app=Path('src/MainApp.tsx')
          a=app.read_text()
          if 'item.channelLogo?<Image' not in a:
              old="<Text style={{width:62,fontSize:11,fontWeight:'800',color:'#555'}} numberOfLines={1}>{item.channel}</Text>"
              new="<View style={{width:62,height:28,alignItems:'flex-start',justifyContent:'center'}}>{item.channelLogo?<Image source={{uri:item.channelLogo}} resizeMode=\"contain\" style={{width:52,height:22}}/>:<Text style={{width:62,fontSize:10.5,fontWeight:'800',color:'#555'}} numberOfLines={1}>{item.channel}</Text>}</View>"
              if old in a:
                  a=a.replace(old,new,1)
                  app.write_text(a)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tvPrograms.ts src/MainApp.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Ensure guide channel logos are supported'
          git push

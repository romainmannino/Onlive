name: Fix guide visible now
on:
  push:
    paths:
      - '.github/workflows/fix-guide-visible-now.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Polish guide rows and sport detection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/MainApp.tsx')
          s=p.read_text()

          old="<View style={{width:62,height:28,alignItems:'flex-start',justifyContent:'center'}}>{item.channelLogo?<Image source={{uri:item.channelLogo}} resizeMode=\"contain\" style={{width:52,height:22}}/>:<Text style={{width:62,fontSize:10.5,fontWeight:'800',color:'#555'}} numberOfLines={1}>{item.channel}</Text>}</View>"
          new="<View style={{width:68,height:42,alignItems:'center',justifyContent:'center'}}>{item.channelLogo?<><Image source={{uri:item.channelLogo}} resizeMode=\"contain\" style={{width:38,height:22}}/><Text style={{marginTop:2,width:66,textAlign:'center',fontSize:8.5,fontWeight:'700',color:'#777'}} numberOfLines={1}>{item.channel}</Text></>:<Text style={{width:66,textAlign:'center',fontSize:9.5,fontWeight:'800',color:'#555'}} numberOfLines={2}>{item.channel}</Text>}</View>"
          if old in s:
              s=s.replace(old,new,1)

          marker="function sportType(p:Program){const t="
          replacement="function sportType(p:Program){const cat=String(p.category||'').toLowerCase();if(cat==='rugby')return'Rugby';if(cat==='basket')return'Basket';if(cat==='handball')return'Handball';if(cat==='cyclisme')return'Cyclisme';if(cat==='golf')return'Golf';if(cat==='natation')return'Natation';if(cat==='athlétisme'||cat==='athletisme')return'Athlétisme';if(cat==='mma'||cat==='boxe')return'Sports de combat';if(cat==='f1 / auto')return'F1 / Auto';const t="
          if marker in s and "const cat=String(p.category||'').toLowerCase()" not in s:
              s=s.replace(marker,replacement,1)

          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MainApp.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Show channel names below logos and improve sport filters'
          git push

name: Fix football classification
on:
  push:
    paths: ['.github/workflows/fix-foot-classification.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Fix football classification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch football detection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/MainApp.tsx')
          t=p.read_text()
          old="function sportType(p:Program){const t=`${p.title} ${p.channel}`.toLowerCase();if(p.category==='Foot'||/foot|ligue 1|ligue 2|champions league|premier league|serie a|liga|reims|clermont|saint-étienne/.test(t))return'Football';if(/tennis|masters 1000|roland|wimbledon|us open|australian open/.test(t))return'Tennis';if(/rugby|top 14|six nations/.test(t))return'Rugby';if(/formula|formule|f1|grand prix|auto|nascar/.test(t))return'F1 / Auto';if(/cyclisme|tour de france|giro|vuelta/.test(t))return'Cyclisme';if(/basket|nba|euroleague/.test(t))return'Basket';if(/handball/.test(t))return'Handball';if(/moto|motogp|superbike/.test(t))return'Moto';if(/volley/.test(t))return'Volley';if(/golf|pga|ryder/.test(t))return'Golf';if(/boxe|mma|ufc|combat|judo|karaté/.test(t))return'Sports de combat';if(/athl|marathon|100 m|200 m|400 m/.test(t))return'Athlétisme';return'Autres'}"
          new="function sportType(p:Program){const t=`${p.title} ${p.channel}`.toLowerCase();const football=/\\b(foot|football|ligue 1|ligue 2|champions league|league champions|europa league|conference league|premier league|championship|efl|serie a|serie b|bundesliga|2\\.? bundesliga|la liga|laliga|liga portugal|primeira liga|eredivisie|jupiler pro league|super lig|mls|coupe de france|fa cup|carabao cup|community shield|uefa|fifa|world cup|euro 20\\d{2}|can 20\\d{2}|burnley|west ham|watford|southampton|benfica|casa pia|porto|sporting|psg|paris saint-germain|marseille|lyon|monaco|lille|lens|rennes|nice|nantes|toulouse|strasbourg|auxerre|le havre|angers|brest|lorient|metz|saint-étienne|clermont|reims|bordeaux|montpellier|real madrid|barcelona|atlético|atletico|arsenal|chelsea|liverpool|manchester|tottenham|newcastle|aston villa|juventus|inter milan|ac milan|napoli|roma|bayern|dortmund|leverkusen)\\b/;if(p.category==='Foot'||football.test(t))return'Football';if(/tennis|masters 1000|roland|wimbledon|us open|australian open/.test(t))return'Tennis';if(/rugby|top 14|six nations/.test(t))return'Rugby';if(/formula|formule|f1|grand prix|auto|nascar/.test(t))return'F1 / Auto';if(/cyclisme|tour de france|giro|vuelta/.test(t))return'Cyclisme';if(/basket|nba|euroleague/.test(t))return'Basket';if(/handball/.test(t))return'Handball';if(/moto|motogp|superbike/.test(t))return'Moto';if(/volley/.test(t))return'Volley';if(/golf|pga|ryder/.test(t))return'Golf';if(/boxe|mma|ufc|combat|judo|karaté/.test(t))return'Sports de combat';if(/athl|marathon|100 m|200 m|400 m/.test(t))return'Athlétisme';return'Autres'}"
          if old not in t:
              raise SystemExit('sportType anchor missing')
          t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name onlive-bot
          git config user.email actions@users.noreply.github.com
          git add src/MainApp.tsx
          git commit -m "Classify football fixtures reliably"
          git push

name: Onlive discussion polish

on:
  push:
    paths:
      - '.github/workflows/onlive-discussion-polish.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refine notify prompt and discussion list
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Home: explanatory sentence + discreet notification icon button
          p=Path('src/MainApp.tsx')
          s=p.read_text()
          old="""{selectedProgram&&matches.length>0&&<TouchableOpacity onPress={()=>{setNotifySelected([]);setNotifyOpen(true)}} style={s.notifyButton}><LinearGradient colors={['#eee9ff','#ffe8f8']} style={s.notifyButtonGradient}><Ionicons name=\"notifications-outline\" size={18} color=\"#6b2cff\"/><Text style={s.notifyButtonText}>Prévenir mes proches « {selectedProgram.title} »</Text></LinearGradient></TouchableOpacity>}"""
          new="""{selectedProgram&&matches.length>0&&<View style={s.notifyPrompt}><Text numberOfLines={1} ellipsizeMode=\"tail\" style={s.notifyHint}>Préviens tes proches que tu regardes « {selectedProgram.title} »</Text><TouchableOpacity accessibilityLabel=\"Prévenir mes proches\" onPress={()=>{setNotifySelected([]);setNotifyOpen(true)}} style={s.notifyIconButton}><Ionicons name=\"notifications-outline\" size={19} color=\"#6b2cff\"/></TouchableOpacity></View>}"""
          if old not in s:
              raise SystemExit('notify CTA source not found')
          s=s.replace(old,new,1)
          s=s.replace("notifyButton:{marginTop:18,width:'100%'},notifyButtonGradient:{minHeight:40,borderRadius:20,padding:12,flexDirection:'row',alignItems:'center',justifyContent:'center',gap:8,paddingVertical:9,paddingHorizontal:16,width:'auto',alignSelf:'flex-start'},notifyButtonText:{color:'#6b2cff',fontWeight:'600',fontSize:14,textAlign:'left',flexShrink:1},",
                      "notifyPrompt:{width:'100%',marginTop:14,alignItems:'center'},notifyHint:{width:'100%',fontSize:12,color:'#333',fontWeight:'400',textAlign:'center'},notifyIconButton:{width:38,height:38,borderRadius:19,backgroundColor:'#f1ecff',alignItems:'center',justifyContent:'center',marginTop:9},")
          p.write_text(s)

          # Discussions: current selected program as context, compact WhatsApp-like rows
          p=Path('src/ChatScreen.tsx')
          s=p.read_text()
          s=s.replace("const[rooms,setRooms]=useState<Room[]>([]),[roomId,setRoomId]=useState<string|null>(initialRoomId||null),[messages,setMessages]=useState<Msg[]>([]),[text,setText]=useState(''),[inviteOpen,setInviteOpen]=useState(false),[knownPeople,setKnownPeople]=useState<KnownPerson[]>([]);",
                      "const[rooms,setRooms]=useState<Room[]>([]),[roomId,setRoomId]=useState<string|null>(initialRoomId||null),[messages,setMessages]=useState<Msg[]>([]),[text,setText]=useState(''),[inviteOpen,setInviteOpen]=useState(false),[knownPeople,setKnownPeople]=useState<KnownPerson[]>([]),[currentProgram,setCurrentProgram]=useState<{id:string;title:string}|null>(null);")
          old_load="async function loadRooms(){const{data}=await supabase.rpc('my_chat_rooms_v2');setRooms(((data||[])as Room[]).map(r=>({...r,unread_count:Number(r.unread_count)||0})));const{data:count}=await supabase.rpc('chat_unread_count');onUnreadChange(Number(count)||0)}"
          new_load="async function loadRooms(){const{data:status}=await supabase.from('live_status').select('is_live,program_id,tv_programs(title)').eq('user_id',userId).maybeSingle();const programId=status?.is_live?status?.program_id:null;const title=(status as any)?.tv_programs?.title||'';setCurrentProgram(programId?{id:String(programId),title}:null);const{data}=await supabase.rpc('my_chat_rooms_v2');const all=((data||[])as Room[]).map(r=>({...r,unread_count:Number(r.unread_count)||0}));setRooms(programId?all.filter(r=>r.program_id===programId):[]);const{data:count}=await supabase.rpc('chat_unread_count');onUnreadChange(Number(count)||0)}"
          if old_load not in s:
              raise SystemExit('loadRooms source not found')
          s=s.replace(old_load,new_load,1)
          old_list='''if(!roomId)return<SafeAreaView style={s.screen}><View style={s.head}><TouchableOpacity onPress={onBack} style={s.round}><Ionicons name="chevron-back" size={23}/></TouchableOpacity><Text style={s.title}>Discussions</Text><View style={{width:42}}/></View><FlatList data={rooms} keyExtractor={r=>r.room_id} contentContainerStyle={s.list} ListEmptyComponent={<View style={s.empty}><Ionicons name="chatbubbles-outline" size={35} color="#6b2cff"/><Text style={s.emptyTitle}>Aucune discussion active</Text><Text style={s.emptyText}>Depuis l’Accueil, touche un proche Onlive pour démarrer une discussion.</Text></View>} renderItem={({item})=><TouchableOpacity onPress={()=>setRoomId(item.room_id)} style={s.room}><View style={{flex:1}}><Text style={s.program}>{item.program_title}</Text><Text style={s.people}>{label(item.member_ids)}</Text><Text numberOfLines={1} style={s.preview}>{item.last_message||'Nouvelle discussion'}</Text></View>{item.unread_count>0&&<View style={s.roomBadge}><Text style={s.badgeText}>{item.unread_count>99?'99+':item.unread_count}</Text></View>}<Ionicons name="chevron-forward" size={20} color="#aaa"/></TouchableOpacity>}/><BottomNav unreadCount={unreadCount} onHome={onHome} onContacts={onContacts} onProfile={onProfile} profileAvatar={profileAvatar} profileInitials={profileInitials}/></SafeAreaView>;'''
          new_list='''if(!roomId)return<SafeAreaView style={s.screen}><View style={s.head}><TouchableOpacity onPress={onBack} style={s.round}><Ionicons name="chevron-back" size={23}/></TouchableOpacity><Text style={s.title}>Discussions</Text><View style={{width:42}}/></View>{currentProgram?<Text numberOfLines={1} ellipsizeMode="tail" style={s.currentProgram}>{currentProgram.title}</Text>:<Text style={s.currentProgramOff}>Passe Onlive sur un programme pour voir ses discussions.</Text>}<FlatList data={rooms} keyExtractor={r=>r.room_id} contentContainerStyle={s.list} ListEmptyComponent={<View style={s.empty}><Ionicons name="chatbubbles-outline" size={28} color="#6b2cff"/><Text style={s.emptyTitle}>{currentProgram?'Aucune discussion pour le moment':'Tu es Offlive'}</Text><Text style={s.emptyText}>{currentProgram?'Touche un proche qui regarde le même programme pour démarrer une discussion.':'Choisis d’abord ce que tu regardes depuis l’Accueil.'}</Text></View>} renderItem={({item})=><TouchableOpacity onPress={()=>setRoomId(item.room_id)} style={s.room}><View style={{flex:1,minWidth:0}}><Text numberOfLines={1} ellipsizeMode="tail" style={s.people}>{label(item.member_ids)}</Text><Text numberOfLines={1} ellipsizeMode="tail" style={s.preview}>{item.last_message||'Nouvelle discussion'}</Text></View>{item.unread_count>0&&<View style={s.roomBadge}><Text style={s.badgeText}>{item.unread_count>99?'99+':item.unread_count}</Text></View>}<Ionicons name="chevron-forward" size={18} color="#bbb"/></TouchableOpacity>}/><BottomNav unreadCount={unreadCount} onHome={onHome} onContacts={onContacts} onProfile={onProfile} profileAvatar={profileAvatar} profileInitials={profileInitials}/></SafeAreaView>;'''
          if old_list not in s:
              raise SystemExit('discussion list source not found')
          s=s.replace(old_list,new_list,1)
          s=s.replace("title:{fontSize:21,fontWeight:'900'},list:{padding:14,paddingBottom:92},empty:{backgroundColor:'#fff',borderRadius:24,padding:28,alignItems:'center',marginTop:20},emptyTitle:{fontSize:18,fontWeight:'900',marginTop:8},emptyText:{color:'#777',textAlign:'center',marginTop:6},room:{backgroundColor:'#fff',borderRadius:20,padding:16,marginBottom:10,flexDirection:'row',alignItems:'center',gap:9},program:{fontWeight:'900',fontSize:16},people:{fontSize:13,color:'#6b2cff',fontWeight:'700',marginTop:3},preview:{fontSize:13,color:'#888',marginTop:5},",
                      "title:{fontSize:21,fontWeight:'900'},currentProgram:{fontSize:14,color:'#555',fontWeight:'400',marginHorizontal:18,marginTop:-2,marginBottom:8},currentProgramOff:{fontSize:13,color:'#888',fontWeight:'400',marginHorizontal:18,marginTop:-2,marginBottom:8},list:{paddingHorizontal:14,paddingTop:4,paddingBottom:92},empty:{backgroundColor:'#fff',borderRadius:18,padding:22,alignItems:'center',marginTop:10},emptyTitle:{fontSize:16,fontWeight:'700',marginTop:7},emptyText:{fontSize:13,color:'#777',textAlign:'center',marginTop:5},room:{backgroundColor:'#fff',borderRadius:16,paddingHorizontal:14,paddingVertical:11,marginBottom:7,flexDirection:'row',alignItems:'center',gap:8},program:{fontWeight:'600',fontSize:14},people:{fontSize:15,color:'#111',fontWeight:'600'},preview:{fontSize:13,color:'#888',marginTop:3},")
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "onlive-bot"
          git config user.email "noreply@onlive-app.com"
          git add src/MainApp.tsx src/ChatScreen.tsx
          git commit -m "Refine notify prompt and contextual discussions"
          git push origin HEAD:main

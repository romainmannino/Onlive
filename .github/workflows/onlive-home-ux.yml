name: Onlive home UX redesign
on:
  push:
    paths: ['.github/workflows/onlive-home-ux.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Onlive home UX redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MainApp
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/MainApp.tsx'); t=p.read_text()

          old="const visiblePrograms=useMemo(()=>programs.filter(p=>programState(p,now)!=='expired').filter(p=>{if(filter==='Tous')return true;if(filter==='Sport'){const isSport=p.category==='Sport'||p.category==='Foot';return isSport&&(sportFilter==='Tous'||sportType(p)===sportFilter)}return p.category===filter}),[filter,sportFilter,programs,now]);"
          new="const visiblePrograms=useMemo(()=>{const list=programs.filter(p=>programState(p,now)!=='expired').filter(p=>{if(filter==='Tous')return true;if(filter==='Sport'){const isSport=p.category==='Sport'||p.category==='Foot';return isSport&&(sportFilter==='Tous'||sportType(p)===sportFilter)}return p.category===filter});if(!selectedProgram)return list;return [...list].sort((a,b)=>a.id===selectedProgram.id?-1:b.id===selectedProgram.id?1:0)},[filter,sportFilter,programs,now,selectedProgram]);"
          if old not in t: raise SystemExit('visiblePrograms anchor missing')
          t=t.replace(old,new,1)

          old_header="<View style={s.headerCard}>{selectedProgram?<TouchableOpacity onPress={goOfflive} style={s.statusWrap}><LinearGradient colors={['#4932ff','#ed00b3']} style={s.statusOn}><Text style={s.statusOnText}>● ONLIVE</Text></LinearGradient></TouchableOpacity>:<TouchableOpacity style={s.statusWrap} onPress={()=>Alert.alert('Tu es Offlive','Choisis un programme en cours pour passer Onlive.')}><View style={s.statusOff}><Text style={s.statusOffText}>● OFFLIVE</Text></View></TouchableOpacity>}</View>"
          if old_header not in t: raise SystemExit('status header anchor missing')
          t=t.replace(old_header,"",1)
          t=t.replace("'Clique sur un programme pour passer Onlive.'","'Clique sur un programme pour indiquer ce que tu regardes.'",1)
          t=t.replace("Tes proches Onlive","Que regardent tes proches ?",1)
          t=t.replace("Aucun proche Onlive pour l'instant","Aucun proche ne regarde de programme pour l'instant",1)

          oldstyle="programCard:{width:170,height:215,borderRadius:20,overflow:'hidden',backgroundColor:'#222',borderWidth:0},programCardSelected:{borderWidth:3,borderColor:'#ed00b3'},programCardFuture:{opacity:.52}"
          newstyle="programCard:{width:170,height:215,borderRadius:20,overflow:'hidden',backgroundColor:'#222',borderWidth:0},programCardSelected:{padding:3,backgroundColor:'transparent'},programCardInner:{flex:1,borderRadius:17,overflow:'hidden',backgroundColor:'#222'},programCardFuture:{opacity:.52}"
          if oldstyle not in t: raise SystemExit('program style anchor missing')
          t=t.replace(oldstyle,newstyle,1)

          old_open="return<TouchableOpacity disabled={state==='future'} onPress={()=>chooseProgram(item)} style={[s.programCard,selected&&s.programCardSelected,state==='future'&&s.programCardFuture]}>"
          new_open="return<TouchableOpacity disabled={state==='future'} onPress={()=>chooseProgram(item)} style={[s.programCard,selected&&s.programCardSelected,state==='future'&&s.programCardFuture]}>{selected&&<LinearGradient colors={['#315CFF','#F000B8']} start={{x:0,y:0}} end={{x:1,y:1}} style={StyleSheet.absoluteFillObject}/>}<View style={s.programCardInner}>"
          if old_open not in t: raise SystemExit('program card opening anchor missing')
          t=t.replace(old_open,new_open,1)

          old_close="<Text style={s.programTitle} numberOfLines={2}>{item.title}</Text></View></TouchableOpacity>}}/><View style={s.liveSectionHead}>"
          new_close="<Text style={s.programTitle} numberOfLines={2}>{item.title}</Text></View></View></TouchableOpacity>}}/><View style={s.liveSectionHead}>"
          if old_close not in t: raise SystemExit('program card closing anchor missing')
          t=t.replace(old_close,new_close,1)

          p.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name onlive-bot
          git config user.email actions@users.noreply.github.com
          git add src/MainApp.tsx
          git commit -m "Simplify TV status and improve home presence UX"
          git push

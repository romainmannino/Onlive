name: Apply Onlive presence v2 direct
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-onlive-presence-v2-direct.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply presence and home UX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/MainApp.tsx'); s=p.read_text()
          s=s.replace("import React,{useEffect,useMemo,useState}from'react';","import React,{useEffect,useMemo,useRef,useState}from'react';",1)
          s=s.replace("import{Alert,FlatList,Image,Linking,Modal,SafeAreaView,ScrollView,Share,StyleSheet,TouchableOpacity,View,useWindowDimensions,Platform,StatusBar as NativeStatusBar}from'react-native';","import{ActivityIndicator,Alert,Animated,FlatList,Image,Linking,Modal,SafeAreaView,ScrollView,Share,StyleSheet,Switch,TouchableOpacity,View,useWindowDimensions,Platform,StatusBar as NativeStatusBar}from'react-native';",1)
          anchor="  const[notifyOpen,setNotifyOpen]=useState(false);"
          if anchor not in s: raise SystemExit('state anchor missing')
          s=s.replace(anchor,"  const[tvBrowsing,setTvBrowsing]=useState(false);const[friendsLoading,setFriendsLoading]=useState(true);const presencePulse=useRef(new Animated.Value(1)).current;\n"+anchor,1)
          anchor="  useEffect(()=>{if(!userId||reviewMode)return;let cancelled=false;(async()=>{try{const scheduled=await Notifications.getAllScheduledNotificationsAsync();"
          extra="  useEffect(()=>{const loop=Animated.loop(Animated.sequence([Animated.timing(presencePulse,{toValue:.35,duration:700,useNativeDriver:true}),Animated.timing(presencePulse,{toValue:1,duration:700,useNativeDriver:true})]));loop.start();return()=>loop.stop()},[presencePulse]);\n  useEffect(()=>{if(!userId||!tvBrowsing||reviewMode)return;const beat=()=>supabase.from('live_status').update({is_live:true,presence_mode:'browsing',last_seen_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('user_id',userId).then(()=>{});beat();const timer=setInterval(beat,60000);return()=>clearInterval(timer)},[userId,tvBrowsing,reviewMode]);\n"
          if anchor not in s: raise SystemExit('effect anchor missing')
          s=s.replace(anchor,extra+anchor,1)
          a=s.index("  async function restoreOwnStatus"); b=s.index("  async function submitAuth",a)
          s=s[:a]+"  async function restoreOwnStatus(uid:string){const{data}=await supabase.from('live_status').select('is_live,program_id,presence_mode,last_seen_at,updated_at,tv_programs(id,title,channel,category,start_time,program_date,image_url,is_live)').eq('user_id',uid).maybeSingle();const mode=(data as any)?.presence_mode||((data as any)?.is_live?((data as any)?.program_id?'watching':'browsing'):'off');const seen=(data as any)?.last_seen_at||(data as any)?.updated_at;const browsingFresh=mode==='browsing'&&seen&&Date.now()-new Date(seen).getTime()<2*60*60*1000;if(mode==='browsing'&&browsingFresh){setTvBrowsing(true);setSelectedProgram(null);return}if(mode==='browsing'&&!browsingFresh){setTvBrowsing(false);await supabase.from('live_status').update({is_live:false,presence_mode:'off',program_id:null,started_at:null,updated_at:new Date().toISOString()}).eq('user_id',uid);return}const q:any=(data as any)?.tv_programs;if((data as any)?.is_live&&mode==='watching'&&q){const restored={id:q.id,title:q.title,channel:q.channel,category:q.category,time:String(q.start_time).slice(0,5),image:q.image_url||'',isLive:Boolean(q.is_live)} as Program;const start=q.program_date&&q.start_time?new Date(`${q.program_date}T${String(q.start_time).slice(0,8)}`).getTime():NaN;const expired=Number.isFinite(start)?Date.now()>start+4*60*60*1000:programState(restored)==='expired';if(!expired){setSelectedProgram(restored);setTvBrowsing(false)}else await supabase.from('live_status').update({is_live:false,presence_mode:'off',program_id:null,started_at:null,updated_at:new Date().toISOString()}).eq('user_id',uid)}else{setTvBrowsing(false);setSelectedProgram(null)}}\n"+s[b:]
          a=s.index("  async function refreshLiveFriends"); b=s.index("\n\n  async function chooseProgram",a)
          s=s[:a]+"  async function refreshLiveFriends(list=matches){if(reviewMode){if(!selectedProgram&&!tvBrowsing){setLiveFriends([]);setFriendsLoading(false);return}setLiveFriends([{...list[0],programId:selectedProgram?.id||null,program:selectedProgram?.title||'',channel:selectedProgram?.channel||'',since:'depuis 12 min'},{...list[1],programId:selectedProgram?.id||null,program:selectedProgram?.title||'',channel:selectedProgram?.channel||'',since:'depuis 8 min'},{...list[2],programId:selectedProgram?.id||null,program:selectedProgram?.title||'',channel:selectedProgram?.channel||'',since:'depuis 4 min'}]);setFriendsLoading(false);return}if(!list.length){setLiveFriends([]);setFriendsLoading(false);return}const{data,error}=await supabase.from('live_status').select('user_id,program_id,is_live,started_at,presence_mode,last_seen_at,updated_at,tv_programs(title,channel,start_time,program_date)').in('user_id',list.map(x=>x.userId)).eq('is_live',true);if(error){setFriendsLoading(false);return}const nowMs=Date.now();setLiveFriends((data||[]).flatMap((r:any)=>{const m=list.find(x=>x.userId===r.user_id);if(!m)return[];const mode=r.presence_mode||(r.program_id?'watching':'browsing');const seen=r.last_seen_at||r.updated_at;if(mode==='browsing'){if(!seen||nowMs-new Date(seen).getTime()>=2*60*60*1000)return[];const mins=Math.max(0,Math.floor((nowMs-new Date(seen).getTime())/60000));return[{...m,programId:null,program:'',channel:'',since:`depuis ${mins} min`}]};if(mode!=='watching'||!r.program_id)return[];const mins=r.started_at?Math.max(0,Math.floor((nowMs-new Date(r.started_at).getTime())/60000)):0;const pd=r.tv_programs?.program_date,pt=r.tv_programs?.start_time;if(pd&&pt){const start=new Date(`${pd}T${String(pt).slice(0,8)}`).getTime();if(Number.isFinite(start)&&nowMs>start+4*60*60*1000)return[]}return[{...m,programId:r.program_id,program:r.tv_programs?.title||'Programme',channel:r.tv_programs?.channel||'',since:`depuis ${mins} min`,startTime:pt?String(pt).slice(0,5):undefined}]}));setFriendsLoading(false)}\n"+s[b:]
          a=s.index("  async function chooseProgram"); b=s.index("  async function bumpScore",a)
          block="  async function setBrowsingPresence(active:boolean){if(!userId)return;if(active){const t=new Date().toISOString();const{error}=await supabase.from('live_status').upsert({user_id:userId,program_id:null,is_live:true,presence_mode:'browsing',started_at:t,last_seen_at:t,updated_at:t},{onConflict:'user_id'});if(error)return Alert.alert('Statut impossible',error.message);setSelectedProgram(null);setTvBrowsing(true)}else{const{error}=await supabase.from('live_status').upsert({user_id:userId,program_id:null,is_live:false,presence_mode:'off',started_at:null,last_seen_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)return Alert.alert('Statut impossible',error.message);setTvBrowsing(false);setSelectedProgram(null)}}\n  async function chooseProgram(program:Program){if(!userId)return;setProgramGuideOpen(false);if(selectedProgram?.id===program.id)return goOfflive();if(!programSelectable(program,now))return Alert.alert('Programme à venir',`Tu pourras te positionner Onlive 15 minutes avant ${program.time}.`);if(reviewMode){setTvBrowsing(false);setSelectedProgram(program);onReviewProgramChange?.({id:program.id,title:program.title,channel:program.channel});return}if(programSource!=='supabase')return Alert.alert('Programme de démonstration','Reconnecte-toi avec internet pour publier un vrai statut.');const t=new Date().toISOString();const{error}=await supabase.from('live_status').upsert({user_id:userId,program_id:program.id,is_live:true,presence_mode:'watching',started_at:t,last_seen_at:t,updated_at:t},{onConflict:'user_id'});if(error)return Alert.alert('Impossible de passer Onlive',error.message);setTvBrowsing(false);setSelectedProgram(program)}\n  async function goOfflive(){if(reviewMode){setSelectedProgram(null);setTvBrowsing(false);setLiveFriends([]);onReviewProgramChange?.(null);return}if(userId){const{error}=await supabase.from('live_status').upsert({user_id:userId,program_id:null,is_live:false,presence_mode:'off',started_at:null,last_seen_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)return Alert.alert('Impossible de passer Offlive',error.message)}setSelectedProgram(null);setTvBrowsing(false)}\n"
          s=s[:a]+block+s[b:]
          old="const canChat=Boolean(selectedProgram&&f.programId===selectedProgram.id);"; new="const canChat=Boolean(tvBrowsing||(selectedProgram&&(f.programId===selectedProgram.id||!f.programId)));"
          if old not in s: raise SystemExit('canChat missing')
          s=s.replace(old,new,1)
          old="if(!selectedProgram){setAttentionFlash(true);setTimeout(()=>setAttentionFlash(false),3000);return}"
          new="if(!selectedProgram){if(f.programId){Alert.alert('Rejoindre le même programme',`Pour discuter avec ${f.name}, sélectionne le même programme : « ${f.program} ».`,[{text:'Rester sans programme',style:'cancel'},{text:`Rejoindre « ${f.program} »`,onPress:async()=>{const friendProgram=programs.find(p=>p.id===f.programId);if(!friendProgram)return Alert.alert('Programme indisponible','Ce programme n’est plus disponible.');await chooseProgram(friendProgram);onStartChat?.(target)}}]);return}Alert.alert('Passer Onlive',`Pour discuter avec ${f.name}, indique que tu es devant la TV.`,[{text:'Rester Offlive',style:'cancel'},{text:'Je suis devant la TV',onPress:async()=>{await setBrowsingPresence(true);onStartChat?.(target)}}]);return}"
          if old not in s: raise SystemExit('popup anchor missing')
          s=s.replace(old,new,1)
          old='<View style={s.scrollLogoHeader}><Image source={LOGO_ON} resizeMode="contain" style={[s.onLogo,Platform.OS===\'android\'&&{transform:[{translateY:8}]}]}/></View>'
          new='<View style={s.scrollLogoHeader}><Image source={LOGO_ON} resizeMode="contain" style={[s.onLogo,Platform.OS===\'android\'&&{transform:[{translateY:8}]}]}/><View style={s.topPresence}>{(selectedProgram||tvBrowsing)?<><Animated.View style={{opacity:presencePulse}}><LinearGradient colors={[\'#4932ff\',\'#ed00b3\']} style={s.topPresenceDot}/></Animated.View><Text style={s.topPresenceOn}>ONLIVE</Text></>:<><View style={[s.topPresenceDot,{backgroundColor:\'#b8b8bf\'}]}/><Text style={s.topPresenceOff}>OFFLIVE</Text></>}</View></View>'
          if old not in s: raise SystemExit('header anchor missing')
          s=s.replace(old,new,1)
          old='</View><TouchableOpacity accessibilityLabel="Mes favoris" onPress={()=>setFavoritesOpen(true)}'
          new='</View>{selectedProgram&&<TouchableOpacity accessibilityLabel="Quitter ce programme" onPress={goOfflive} style={s.leaveProgramButton}><Ionicons name="close-circle" size={21} color="#e32b45"/></TouchableOpacity>}<TouchableOpacity accessibilityLabel="Mes favoris" onPress={()=>setFavoritesOpen(true)}'
          if old not in s: raise SystemExit('x anchor missing')
          s=s.replace(old,new,1)
          old='}}/>{programGuideOpen&&'; new='}}/><View style={s.tvPresenceRow}><Text style={s.tvPresenceLabel}>Je suis devant la TV</Text><Switch value={tvBrowsing&&!selectedProgram} onValueChange={v=>setBrowsingPresence(v)} disabled={Boolean(selectedProgram)} trackColor={{false:\'#d8d8de\',true:\'#b9a6ff\'}} thumbColor={tvBrowsing&&!selectedProgram?\'#6b2cff\':\'#f4f4f6\'}/></View>{programGuideOpen&&'
          if old not in s: raise SystemExit('switch anchor missing')
          s=s.replace(old,new,1)
          old='{sortedLiveFriends.length?<View style={s.friendsCard}>'; new='{friendsLoading&&!sortedLiveFriends.length?<View style={s.emptyFriends}><ActivityIndicator size="small" color="#6b2cff"/><Text style={[s.emptyTitle,{fontWeight:\'500\',marginTop:8}]}>ONLIVE</Text></View>:sortedLiveFriends.length?<View style={s.friendsCard}>'
          if old not in s: raise SystemExit('loading anchor missing')
          s=s.replace(old,new,1)
          s=s.replace("<Text style={s.friendSummaryMeta}> {f.startTime&&(()=>{const[h,m]=f.startTime.split(':').map(Number);const d=new Date();d.setHours(h||0,m||0,0,0);return Date.now()<d.getTime()})()?'va regarder':'regarde'} {f.channel} · {f.since}</Text>","<Text style={s.friendSummaryMeta}> {f.programId?`${f.startTime&&(()=>{const[h,m]=f.startTime.split(':').map(Number);const d=new Date();d.setHours(h||0,m||0,0,0);return Date.now()<d.getTime()})()?'va regarder':'regarde'} ${f.channel}`:'est devant la TV'} · {f.since}</Text>",1)
          s=s.replace('<Text style={s.friendProgramCompact} numberOfLines={1} ellipsizeMode="tail">« {f.program} »</Text>','{f.programId&&<Text style={s.friendProgramCompact} numberOfLines={1} ellipsizeMode="tail">« {f.program} »</Text>}',1)
          anchor="favoriteTopButton:{width:34,height:34,alignItems:'center',justifyContent:'center'},"
          if anchor not in s: raise SystemExit('style anchor missing')
          s=s.replace(anchor,anchor+"leaveProgramButton:{width:30,height:34,alignItems:'center',justifyContent:'center'},topPresence:{position:'absolute',right:13,top:17,flexDirection:'row',alignItems:'center',gap:5},topPresenceDot:{width:9,height:9,borderRadius:5},topPresenceOn:{fontSize:9.5,fontWeight:'800',color:'#6b2cff'},topPresenceOff:{fontSize:9.5,fontWeight:'700',color:'#999'},tvPresenceRow:{minHeight:44,marginTop:8,marginBottom:4,paddingHorizontal:2,flexDirection:'row',alignItems:'center',justifyContent:'space-between'},tvPresenceLabel:{fontSize:15,fontWeight:'700',color:'#111'},",1)
          p.write_text(s)

          p=Path('src/Root.tsx'); r=p.read_text(); a=r.index(" const startChat=async(target:ChatTarget)=>"); b=r.index(" const goHome=",a)
          replacement=" const startChat=async(target:ChatTarget)=>{if(reviewMode&&target.userId.startsWith('review-demo-')){setProfileOpenSignal(0);setNotificationRoomId(null);setChatTarget(target);setMode('chat');return}if(!userId)return;const{data:mine}=await supabase.from('live_status').select('is_live,program_id,presence_mode,last_seen_at,updated_at').eq('user_id',userId).maybeSingle();const{data:theirs}=await supabase.from('live_status').select('is_live,program_id,presence_mode,last_seen_at,updated_at').eq('user_id',target.userId).maybeSingle();const effective=(v:any)=>{if(!v?.is_live)return'off';const m=v.presence_mode||(v.program_id?'watching':'browsing');if(m==='browsing'){const seen=v.last_seen_at||v.updated_at;if(!seen||Date.now()-new Date(seen).getTime()>=2*60*60*1000)return'off'}return m};const myMode=effective(mine),theirMode=effective(theirs);if(myMode==='off')return Alert.alert('Tu es Offlive','Choisis un programme ou active « Je suis devant la TV » pour démarrer une discussion.');if(theirMode==='off')return Alert.alert('Proche Offlive',`${target.name} n’est plus Onlive.`);if(myMode==='watching'&&theirMode==='watching'&&mine?.program_id!==theirs?.program_id)return Alert.alert('Programme différent',`Pour démarrer une nouvelle discussion avec ${target.name}, vous devez regarder le même programme.`);setProfileOpenSignal(0);setNotificationRoomId(null);setChatTarget(target);setMode('chat')};\n"
          p.write_text(r[:a]+replacement+r[b:])
          PY
      - name: Refresh lockfile and typecheck
        run: |
          npm install --package-lock-only
          npm install
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MainApp.tsx src/Root.tsx package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Add browsing presence and resilient home chat UX"
          git push

name: Polish contacts UI

on:
  push:
    paths:
      - '.github/workflows/polish-contacts-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply contacts UI polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish contacts only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/MainApp.tsx')
          t=p.read_text()
          original=t

          # Contact list rows: reduce height/padding/radius when those style keys exist.
          def patch_style(name, repls):
              nonlocal_t = None
              global t
              m=re.search(rf'({re.escape(name)}\s*:\s*\{{)(.*?)(\}}\s*,)', t, re.S)
              if not m:
                  return False
              body=m.group(2)
              for pat, rep in repls:
                  if re.search(pat, body):
                      body=re.sub(pat, rep, body, count=1)
              t=t[:m.start(2)]+body+t[m.end(2):]
              return True

          candidates={
            'contactRow':[(r'paddingVertical\s*:\s*\d+','paddingVertical:10'),(r'paddingHorizontal\s*:\s*\d+','paddingHorizontal:14'),(r'borderRadius\s*:\s*\d+','borderRadius:20'),(r'marginBottom\s*:\s*\d+','marginBottom:8')],
            'contactCard':[(r'paddingVertical\s*:\s*\d+','paddingVertical:10'),(r'paddingHorizontal\s*:\s*\d+','paddingHorizontal:14'),(r'borderRadius\s*:\s*\d+','borderRadius:20'),(r'marginBottom\s*:\s*\d+','marginBottom:8')],
            'contactItem':[(r'paddingVertical\s*:\s*\d+','paddingVertical:10'),(r'paddingHorizontal\s*:\s*\d+','paddingHorizontal:14'),(r'borderRadius\s*:\s*\d+','borderRadius:20'),(r'marginBottom\s*:\s*\d+','marginBottom:8')],
            'contactName':[(r'fontSize\s*:\s*\d+','fontSize:16'),(r"fontWeight\s*:\s*['\"]\d+['\"]","fontWeight:'600'")],
            'contactSub':[(r'fontSize\s*:\s*\d+','fontSize:13'),(r'lineHeight\s*:\s*\d+','lineHeight:17')],
            'contactSubtitle':[(r'fontSize\s*:\s*\d+','fontSize:13'),(r'lineHeight\s*:\s*\d+','lineHeight:17')],
            'contactAvatar':[(r'width\s*:\s*\d+','width:46'),(r'height\s*:\s*\d+','height:46'),(r'borderRadius\s*:\s*\d+','borderRadius:23')],
            'contactAvatarText':[(r'fontSize\s*:\s*\d+','fontSize:15'),(r"fontWeight\s*:\s*['\"]\d+['\"]","fontWeight:'600'")],
            'contactBadge':[(r'paddingVertical\s*:\s*\d+','paddingVertical:7'),(r'paddingHorizontal\s*:\s*\d+','paddingHorizontal:11'),(r'borderRadius\s*:\s*\d+','borderRadius:16')],
            'contactBadgeText':[(r'fontSize\s*:\s*\d+','fontSize:13'),(r"fontWeight\s*:\s*['\"]\d+['\"]","fontWeight:'600'")],
            'inviteBtn':[(r'paddingVertical\s*:\s*\d+','paddingVertical:7'),(r'paddingHorizontal\s*:\s*\d+','paddingHorizontal:11'),(r'borderRadius\s*:\s*\d+','borderRadius:16')],
            'inviteBtnText':[(r'fontSize\s*:\s*\d+','fontSize:13'),(r"fontWeight\s*:\s*['\"]\d+['\"]","fontWeight:'600'")],
          }

          changed=[]
          for name,repls in candidates.items():
              if patch_style(name,repls): changed.append(name)

          # If the contact name style is defined under a generic name in the Contacts screen,
          # soften only direct instances used immediately before “Déjà sur Onlive”.
          if 'Déjà sur Onlive' in t:
              # Keep functionality untouched; this workflow is intentionally style-only.
              pass

          if t==original:
              raise SystemExit('No contact style anchors found; refusing to touch other screens')
          p.write_text(t)
          print('Patched:', ', '.join(changed))
          PY
      - name: Commit
        run: |
          git config user.name "onlive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/MainApp.tsx
          git commit -m "Polish contacts screen density"
          git push

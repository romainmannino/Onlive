name: Onlive navigation redesign

on:
  push:
    paths:
      - '.github/workflows/onlive-nav-redesign.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move profile to bottom navigation and simplify header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # MainApp: remove profile from header, expose a signal to open profile modal,
          # and make the top status area transparent.
          p=Path('src/MainApp.tsx')
          s=p.read_text()
          old="export default function MainApp({onOpenDiscussions,onStartChat,onOpenAccount,unreadCount=0,initialScreen='home'}:{onOpenDiscussions?:()=>void;onStartChat?:(target:ChatTarget)=>void;onOpenAccount?:()=>void;unreadCount?:number;initialScreen?:'home'|'contacts'}){"
          new="export default function MainApp({onOpenDiscussions,onStartChat,onOpenAccount,profileOpenSignal=0,unreadCount=0,initialScreen='home'}:{onOpenDiscussions?:()=>void;onStartChat?:(target:ChatTarget)=>void;onOpenAccount?:()=>void;profileOpenSignal?:number;unreadCount?:number;initialScreen?:'home'|'contacts'}){"
          assert old in s, 'MainApp signature not found'
          s=s.replace(old,new,1)
          anchor="  useEffect(()=>{if(userId&&screen!=='auth')setScreen(initialScreen)},[initialScreen]);\n"
          assert anchor in s, 'MainApp effect anchor not found'
          s=s.replace(anchor,anchor+"  useEffect(()=>{if(profileOpenSignal>0)setProfileOpen(true)},[profileOpenSignal]);\n",1)
          pattern=r'<TouchableOpacity onPress=\{\(\)=>setProfileOpen\(true\)\} style=\{s\.profileButton\}>.*?</TouchableOpacity>'
          s,n=re.subn(pattern,'',s,count=1)
          assert n==1, 'Profile button in header not found'
          s=s.replace("headerCard:{backgroundColor:'#111118',borderRadius:28,padding:10,flexDirection:'row',alignItems:'center',justifyContent:'space-between'}","headerCard:{backgroundColor:'transparent',paddingVertical:4,flexDirection:'row',alignItems:'center',justifyContent:'flex-end'}",1)
          p.write_text(s)

          # Root: add a 4th bottom-nav item which opens the profile modal.
          p=Path('src/Root.tsx')
          s=p.read_text()
          state=" const[accountOpen,setAccountOpen]=useState(false);\n"
          assert state in s, 'Root account state not found'
          s=s.replace(state,state+" const[profileOpenSignal,setProfileOpenSignal]=useState(0);\n",1)
          funcs=" const goHome=()=>{setChatTarget(null);setNotificationRoomId(null);setAppSection('home');setMode('app')};const goContacts=()=>{setChatTarget(null);setNotificationRoomId(null);setAppSection('contacts');setMode('app')};\n"
          assert funcs in s, 'Root navigation functions not found'
          s=s.replace(funcs,funcs+" const openProfile=()=>{setChatTarget(null);setNotificationRoomId(null);setAppSection('home');setMode('app');setProfileOpenSignal(v=>v+1)};\n",1)
          old_chat="if(mode==='chat'&&userId)return<ChatScreen userId={userId} initialTarget={chatTarget} initialRoomId={notificationRoomId} unreadCount={unreadCount} onUnreadChange={setUnreadCount} onBack={goHome} onHome={goHome} onContacts={goContacts}/>;"
          new_chat="if(mode==='chat'&&userId)return<ChatScreen userId={userId} initialTarget={chatTarget} initialRoomId={notificationRoomId} unreadCount={unreadCount} onUnreadChange={setUnreadCount} onBack={goHome} onHome={goHome} onContacts={goContacts} onProfile={openProfile}/>;"
          assert old_chat in s, 'ChatScreen invocation not found'
          s=s.replace(old_chat,new_chat,1)
          old_main="<MainApp key={userId||'guest'} initialScreen={appSection} onOpenDiscussions={openDiscussions} onStartChat={startChat} onOpenAccount={()=>setAccountOpen(true)} unreadCount={unreadCount}/>"
          new_main="<MainApp key={userId||'guest'} initialScreen={appSection} onOpenDiscussions={openDiscussions} onStartChat={startChat} onOpenAccount={()=>setAccountOpen(true)} profileOpenSignal={profileOpenSignal} unreadCount={unreadCount}/>"
          assert old_main in s, 'MainApp invocation not found'
          s=s.replace(old_main,new_main,1)
          old_nav="<NavItem active={appSection==='contacts'} icon=\"people\" label=\"Contacts\" onPress={goContacts}/></View></View>}"
          new_nav="<NavItem active={appSection==='contacts'} icon=\"people\" label=\"Contacts\" onPress={goContacts}/><TouchableOpacity onPress={openProfile} style={s.navItem}><View style={s.inactive}><Ionicons name=\"person-circle-outline\" size={23} color=\"#555\"/><Text style={[s.inactiveText,{color:'#555'}]}>Compte</Text></View></TouchableOpacity></View></View>}"
          assert old_nav in s, 'Root bottom nav contacts item not found'
          s=s.replace(old_nav,new_nav,1)
          p.write_text(s)

          # ChatScreen: mirror the 4-item bottom nav so navigation stays consistent.
          p=Path('src/ChatScreen.tsx')
          s=p.read_text()
          old_sig="export default function ChatScreen({userId,initialTarget,initialRoomId,unreadCount,onUnreadChange,onBack,onHome,onContacts}:{userId:string;initialTarget:ChatTarget|null;initialRoomId?:string|null;unreadCount:number;onUnreadChange:(n:number)=>void;onBack:()=>void;onHome:()=>void;onContacts:()=>void}){"
          new_sig="export default function ChatScreen({userId,initialTarget,initialRoomId,unreadCount,onUnreadChange,onBack,onHome,onContacts,onProfile}:{userId:string;initialTarget:ChatTarget|null;initialRoomId?:string|null;unreadCount:number;onUnreadChange:(n:number)=>void;onBack:()=>void;onHome:()=>void;onContacts:()=>void;onProfile:()=>void}){"
          assert old_sig in s, 'ChatScreen signature not found'
          s=s.replace(old_sig,new_sig,1)
          s=s.replace("<BottomNav unreadCount={unreadCount} onHome={onHome} onContacts={onContacts}/>","<BottomNav unreadCount={unreadCount} onHome={onHome} onContacts={onContacts} onProfile={onProfile}/>",1)
          old_bottom="function BottomNav({unreadCount,onHome,onContacts}:{unreadCount:number;onHome:()=>void;onContacts:()=>void}){return<View style={s.bottomWrap}><View style={s.bottom}><TouchableOpacity onPress={onHome} style={s.nav}><Ionicons name=\"home-outline\" size={21} color=\"#6b2cff\"/><Text style={s.navText}>Accueil</Text></TouchableOpacity><LinearGradient colors={['#4932ff','#ed00b3']} style={[s.nav,s.navSelected]}><View><Ionicons name=\"chatbubbles\" size={21} color=\"#fff\"/>{unreadCount>0&&<View style={s.navBadge}><Text style={s.navBadgeText}>{unreadCount>99?'99+':unreadCount}</Text></View>}</View><Text style={s.navActive}>Discussions</Text></LinearGradient><TouchableOpacity onPress={onContacts} style={s.nav}><Ionicons name=\"people-outline\" size={22} color=\"#d700b0\"/><Text style={[s.navText,{color:'#d700b0'}]}>Contacts</Text></TouchableOpacity></View></View>}"
          new_bottom="function BottomNav({unreadCount,onHome,onContacts,onProfile}:{unreadCount:number;onHome:()=>void;onContacts:()=>void;onProfile:()=>void}){return<View style={s.bottomWrap}><View style={s.bottom}><TouchableOpacity onPress={onHome} style={s.nav}><Ionicons name=\"home-outline\" size={21} color=\"#6b2cff\"/><Text style={s.navText}>Accueil</Text></TouchableOpacity><LinearGradient colors={['#4932ff','#ed00b3']} style={[s.nav,s.navSelected]}><View><Ionicons name=\"chatbubbles\" size={21} color=\"#fff\"/>{unreadCount>0&&<View style={s.navBadge}><Text style={s.navBadgeText}>{unreadCount>99?'99+':unreadCount}</Text></View>}</View><Text style={s.navActive}>Discussions</Text></LinearGradient><TouchableOpacity onPress={onContacts} style={s.nav}><Ionicons name=\"people-outline\" size={22} color=\"#d700b0\"/><Text style={[s.navText,{color:'#d700b0'}]}>Contacts</Text></TouchableOpacity><TouchableOpacity onPress={onProfile} style={s.nav}><Ionicons name=\"person-circle-outline\" size={23} color=\"#555\"/><Text style={[s.navText,{color:'#555'}]}>Compte</Text></TouchableOpacity></View></View>}"
          assert old_bottom in s, 'Chat bottom nav not found'
          s=s.replace(old_bottom,new_bottom,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "onlive-bot"
          git config user.email "noreply@onlive-app.com"
          git add src/MainApp.tsx src/Root.tsx src/ChatScreen.tsx
          git commit -m "Redesign top bar and move profile to bottom nav"
          git push origin HEAD:main

# trigger 2026-08-19
name: Apply Onlive social UI upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/onlive-social-ui-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch MainApp
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/MainApp.tsx')
          s=p.read_text()
          def rep(a,b):
            global s
            if a not in s:
              raise SystemExit('Missing patch anchor: '+a[:100])
            s=s.replace(a,b,1)

          rep("type LiveFriend=Match&{programId:string|null;program:string;channel:string;since:string};", "type LiveFriend=Match&{programId:string|null;program:string;channel:string;since:string;startTime?:string};")
          rep("const REVIEW_EMAIL='review@onlive-app.com';", "const REVIEW_EMAIL='review@onlive-app.com';\nconst LOGO_ON=require('../public/logo carre.png');\nconst FAVORITES_KEY='@onlive/favorites';\nconst FAVORITE_CATALOG=[\n {id:'football',label:'Football',group:'Sports',icon:'football-outline'},\n {id:'tennis',label:'Tennis',group:'Sports',icon:'tennisball-outline'},\n {id:'rugby',label:'Rugby',group:'Sports',icon:'american-football-outline'},\n {id:'basket',label:'Basket',group:'Sports',icon:'basketball-outline'},\n {id:'f1',label:'F1 / Auto',group:'Sports',icon:'speedometer-outline'},\n {id:'cycling',label:'Cyclisme',group:'Sports',icon:'bicycle-outline'},\n {id:'swimming',label:'Natation',group:'Sports',icon:'water-outline'},\n {id:'psg',label:'Paris Saint-Germain',group:'Clubs',icon:'football-outline'},\n {id:'om',label:'Olympique de Marseille',group:'Clubs',icon:'football-outline'},\n {id:'ol',label:'Olympique Lyonnais',group:'Clubs',icon:'football-outline'},\n {id:'france-foot',label:'Équipe de France de football',group:'Équipes',icon:'football-outline'},\n {id:'champions-league',label:'Ligue des champions',group:'Compétitions',icon:'trophy-outline'},\n {id:'ligue1',label:'Ligue 1',group:'Compétitions',icon:'trophy-outline'},\n {id:'roland-garros',label:'Roland-Garros',group:'Compétitions',icon:'tennisball-outline'},\n {id:'tour-france',label:'Tour de France',group:'Compétitions',icon:'bicycle-outline'},\n {id:'koh-lanta',label:'Koh-Lanta',group:'Émissions',icon:'tv-outline'},\n {id:'the-voice',label:'The Voice',group:'Émissions',icon:'mic-outline'},\n {id:'top-chef',label:'Top Chef',group:'Émissions',icon:'restaurant-outline'},\n {id:'adp',label:\"L'Amour est dans le pré\",group:'Émissions',icon:'heart-outline'},\n {id:'action',label:'Films d’action',group:'Films & séries',icon:'film-outline'},\n {id:'comedy',label:'Comédies',group:'Films & séries',icon:'happy-outline'},\n {id:'thriller',label:'Thrillers',group:'Films & séries',icon:'flash-outline'},\n {id:'documentary',label:'Documentaires',group:'Films & séries',icon:'earth-outline'}\n] as const;")
          rep("function programState(p:Program,now=Date.now()):ProgramState{const[h,m]=p.time.split(':').map(Number);const start=new Date();start.setHours(h||0,m||0,0,0);const end=start.getTime()+4*60*60*1000;if(now<start.getTime())return'future';if(now<=end)return'current';return'expired'}", "function programStart(p:Program,now=Date.now()){const[h,m]=p.time.split(':').map(Number);const d=new Date(now);d.setHours(h||0,m||0,0,0);return d.getTime()}\nfunction programState(p:Program,now=Date.now()):ProgramState{const start=programStart(p,now);const end=start+4*60*60*1000;if(now<start)return'future';if(now<=end)return'current';return'expired'}\nfunction minutesUntilProgram(p:Program,now=Date.now()){return Math.ceil((programStart(p,now)-now)/60000)}\nfunction programSelectable(p:Program,now=Date.now()){return programState(p,now)==='current'||minutesUntilProgram(p,now)<=15}\nfunction programTheme(p:Program){const sport=sportType(p);if(p.category==='Sport'||p.category==='Foot'){if(sport==='Football')return{colors:['#174f2d','#0b2b1a','#050807'] as const,icon:'football-outline'};if(sport==='Tennis')return{colors:['#d9b51d','#76630c','#090805'] as const,icon:'tennisball-outline'};if(sport==='Basket')return{colors:['#d86a18','#71320b','#090604'] as const,icon:'basketball-outline'};if(sport==='Rugby')return{colors:['#6d4a22','#302012','#070605'] as const,icon:'american-football-outline'};if(sport==='Cyclisme')return{colors:['#168a76','#0b453c','#050807'] as const,icon:'bicycle-outline'};if(sport==='F1 / Auto'||sport==='Moto')return{colors:['#b42630','#551117','#080506'] as const,icon:'speedometer-outline'};return{colors:['#176b91','#0d3448','#050708'] as const,icon:'trophy-outline'}}if(p.category==='Film')return{colors:['#6b2cff','#311565','#08050d'] as const,icon:'film-outline'};if(p.category==='Série')return{colors:['#315cff','#172b72','#05060c'] as const,icon:'tv-outline'};if(p.category==='Divertissement')return{colors:['#d1009b','#68105d','#09050a'] as const,icon:'mic-outline'};return{colors:['#257e9d','#173c53','#050708'] as const,icon:'sparkles-outline'}}")
          rep("const[notifyOpen,setNotifyOpen]=useState(false);const[notifySelected,setNotifySelected]=useState<string[]>([]);const[liveSearchOpen,setLiveSearchOpen]=useState(false);const[liveSearch,setLiveSearch]=useState('');const[attentionFlash,setAttentionFlash]=useState(false);", "const[notifyOpen,setNotifyOpen]=useState(false);const[notifySelected,setNotifySelected]=useState<string[]>([]);const[liveSearchOpen,setLiveSearchOpen]=useState(false);const[liveSearch,setLiveSearch]=useState('');const[attentionFlash,setAttentionFlash]=useState(false);const[favoritesOpen,setFavoritesOpen]=useState(false);const[favoriteSearch,setFavoriteSearch]=useState('');const[favoriteGroup,setFavoriteGroup]=useState('Tous');const[favorites,setFavorites]=useState<string[]>([]);")
          rep("useEffect(()=>{AsyncStorage.getItem(SCORE_KEY).then(v=>{if(v)try{setContactScores(JSON.parse(v))}catch{}});", "useEffect(()=>{AsyncStorage.getItem(FAVORITES_KEY).then(v=>{if(v)try{setFavorites(JSON.parse(v))}catch{}});AsyncStorage.getItem(SCORE_KEY).then(v=>{if(v)try{setContactScores(JSON.parse(v))}catch{}});")
          rep("useEffect(()=>{if(!userId||screen!=='home')return;checkProgramNotifications();const timer=setInterval(checkProgramNotifications,3000);return()=>clearInterval(timer)},[userId,screen,matches]);", "useEffect(()=>{if(!userId||screen!=='home')return;checkProgramNotifications();const timer=setInterval(checkProgramNotifications,3000);return()=>clearInterval(timer)},[userId,screen,matches]);\n  useEffect(()=>{if(!userId||screen!=='home'||reviewMode)return;const channel=supabase.channel(`onlive-live-${userId}`).on('postgres_changes',{event:'*',schema:'public',table:'live_status'},()=>refreshLiveFriends(matches)).subscribe();return()=>{supabase.removeChannel(channel)}},[userId,screen,matches,selectedProgram,reviewMode]);")
          rep("const sortedLiveFriends=useMemo(()=>{const q=liveSearch.trim().toLowerCase();return[...liveFriends].filter(f=>!q||f.name.toLowerCase().includes(q)).sort((a,b)=>{const aSame=Boolean(selectedProgram&&a.programId===selectedProgram.id),bSame=Boolean(selectedProgram&&b.programId===selectedProgram.id);if(aSame!==bSame)return aSame?-1:1;return a.name.localeCompare(b.name,'fr')})},[liveFriends,selectedProgram,liveSearch]);", "const sortedLiveFriends=useMemo(()=>{const q=liveSearch.trim().toLowerCase();return[...liveFriends].filter(f=>!q||f.name.toLowerCase().includes(q)).sort((a,b)=>{const aSame=Boolean(selectedProgram&&a.programId===selectedProgram.id),bSame=Boolean(selectedProgram&&b.programId===selectedProgram.id);if(aSame!==bSame)return aSame?-1:1;const am=Number(a.since.match(/\\d+/)?.[0]||999),bm=Number(b.since.match(/\\d+/)?.[0]||999);if(am!==bm)return am-bm;return a.name.localeCompare(b.name,'fr')})},[liveFriends,selectedProgram,liveSearch]);\n  const viewerCounts=useMemo(()=>liveFriends.reduce<Record<string,number>>((acc,f)=>{if(f.programId)acc[f.programId]=(acc[f.programId]||0)+1;return acc},{}),[liveFriends]);\n  const favoriteGroups=['Tous',...Array.from(new Set(FAVORITE_CATALOG.map(x=>x.group)))];\n  const visibleFavorites=FAVORITE_CATALOG.filter(x=>(favoriteGroup==='Tous'||x.group===favoriteGroup)&&(!favoriteSearch.trim()||`${x.label} ${x.group}`.toLowerCase().includes(favoriteSearch.trim().toLowerCase())));\n  async function toggleFavorite(id:string){const next=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];setFavorites(next);await AsyncStorage.setItem(FAVORITES_KEY,JSON.stringify(next))}")
          rep("select('user_id,program_id,is_live,started_at,tv_programs(title,channel)')", "select('user_id,program_id,is_live,started_at,tv_programs(title,channel,start_time)')")
          rep("return[{...m,programId:r.program_id||null,program:r.tv_programs?.title||'Programme',channel:r.tv_programs?.channel||'',since:`depuis ${mins} min`}]", "return[{...m,programId:r.program_id||null,program:r.tv_programs?.title||'Programme',channel:r.tv_programs?.channel||'',since:`depuis ${mins} min`,startTime:r.tv_programs?.start_time?String(r.tv_programs.start_time).slice(0,5):undefined}]")
          rep("async function chooseProgram(program:Program){if(!userId)return;if(programState(program)==='future')return Alert.alert('Programme à venir',`Tu pourras te mettre Onlive à partir de ${program.time}.`);", "async function chooseProgram(program:Program){if(!userId)return;if(!programSelectable(program,now))return Alert.alert('Programme à venir',`Tu pourras te positionner Onlive 15 minutes avant ${program.time}.`);")

          old="return<SafeAreaView style={s.screen}><StatusBar style=\"dark\"/><ScrollView contentContainerStyle={[s.homeContent,tabletLayout&&s.homeContentTablet]}><Text style={s.introTitle}>Dis à tes proches ce que tu regardes</Text><Text style={[s.introText,attentionFlash&&s.introTextAttention]}>{selectedProgram?`${selectedProgram.channel} · ${selectedProgram.title}`:'Clique sur un programme pour indiquer ce que tu regardes.'}</Text>"
          new="return<SafeAreaView style={s.screen}><StatusBar style=\"light\"/><View style={s.onliveTopBar}><Image source={LOGO_ON} resizeMode=\"contain\" style={s.onLogo}/><TouchableOpacity accessibilityLabel=\"Mes favoris\" onPress={()=>setFavoritesOpen(true)} style={s.favoriteTopButton}><LinearGradient colors={['#315CFF','#F000B8']} style={s.favoriteTopRing}><View style={s.favoriteTopInner}><Ionicons name={favorites.length?'star':'star-outline'} size={23} color={favorites.length?'#FFD84D':'#f3d95b'}/></View></LinearGradient></TouchableOpacity></View><ScrollView contentContainerStyle={[s.homeContent,tabletLayout&&s.homeContentTablet]}><Text style={[s.introTitle,attentionFlash&&s.introTitleAttention]}>Choisis ton programme</Text>"
          rep(old,new)

          start="<FlatList data={visiblePrograms} horizontal showsHorizontalScrollIndicator={false} keyExtractor={i=>i.id} contentContainerStyle={[s.programList,tabletLayout&&s.programListTablet]} renderItem={({item})=>{"
          end="}}/><View style={s.liveSectionHead}><Text style={s.sectionTitle}>Que regardent tes proches ? ({liveFriends.length})</Text>"
          i=s.find(start); j=s.find(end,i)
          if i<0 or j<0: raise SystemExit('program cards block not found')
          replacement="""<FlatList data={visiblePrograms} horizontal showsHorizontalScrollIndicator={false} keyExtractor={i=>i.id} contentContainerStyle={[s.programList,tabletLayout&&s.programListTablet]} renderItem={({item})=>{const selected=selectedProgram?.id===item.id,state=programState(item,now),selectable=programSelectable(item,now),theme=programTheme(item),count=viewerCounts[item.id]||0;return<TouchableOpacity disabled={!selectable} onPress={()=>chooseProgram(item)} style={[s.programCard,tabletLayout&&s.programCardTablet,selected&&s.programCardSelected,!selectable&&s.programCardLocked]}>{selected&&<LinearGradient colors={['#315CFF','#F000B8']} start={{x:0,y:0}} end={{x:1,y:1}} style={StyleSheet.absoluteFillObject}/>}<View style={s.programCardInner}><LinearGradient colors={selectable?theme.colors:['#555861','#33353b','#101114']} locations={[0,.52,1]} style={s.programVisual}><Ionicons name={theme.icon as any} size={76} color={selectable?'rgba(255,255,255,.20)':'rgba(255,255,255,.10)'}/><View style={s.visualGlow}/></LinearGradient><LinearGradient colors={['transparent','rgba(0,0,0,.92)']} locations={[.25,1]} style={s.programOverlay}/><View style={s.programTopRow}><View style={s.timeBadge}><Text style={s.timeBadgeText}>{item.time}</Text></View><View style={s.programTopRight}>{count>0&&<View style={s.viewerCount}><Ionicons name=\"people\" size={13} color=\"#fff\"/><Text style={s.viewerCountText}>{count}</Text></View>}{state==='future'&&<View style={s.futureBadge}><Text style={s.futureBadgeText}>À VENIR</Text></View>}</View></View><View style={s.programInfo}><Text style={s.programChannel}>{item.channel}</Text><Text style={s.programTitle} numberOfLines={2}>{item.title}</Text></View></View></TouchableOpacity>}}/><View style={s.liveSectionHead}><Text style={s.sectionTitle}>Ils sont Onlive ({liveFriends.length})</Text>"""
          s=s[:i]+replacement+s[j+len(end):]

          rep("<Text style={s.friendSummaryMeta}> regarde {f.channel} · {f.since}</Text>", "<Text style={s.friendSummaryMeta}> {f.startTime&&(()=>{const[h,m]=f.startTime.split(':').map(Number);const d=new Date();d.setHours(h||0,m||0,0,0);return Date.now()<d.getTime()})()?'va regarder':'regarde'} {f.channel} · {f.since}</Text>")

          modal_anchor="<Modal visible={profileOpen} transparent animationType=\"fade\""
          fav_modal="""<Modal visible={favoritesOpen} animationType=\"slide\" onRequestClose={()=>setFavoritesOpen(false)}><SafeAreaView style={s.favoritesScreen}><View style={s.favoritesHeader}><TouchableOpacity onPress={()=>setFavoritesOpen(false)} style={s.roundButton}><Ionicons name=\"chevron-back\" size={23}/></TouchableOpacity><View><Text style={s.favoritesTitle}>Mes favoris</Text><Text style={s.favoritesSubtitle}>Onlive te prévient quand ça commence</Text></View><View style={{width:42}}/></View><View style={s.favoriteSearchBox}><Ionicons name=\"search\" size={19} color=\"#888\"/><TextInput value={favoriteSearch} onChangeText={setFavoriteSearch} placeholder=\"Équipe, émission, sport…\" style={s.favoriteSearchInput}/></View><ScrollView horizontal showsHorizontalScrollIndicator={false} contentContainerStyle={s.favoriteGroups}>{favoriteGroups.map(g=><TouchableOpacity key={g} onPress={()=>setFavoriteGroup(g)} style={[s.favoriteGroupChip,favoriteGroup===g&&s.favoriteGroupChipActive]}><Text style={[s.favoriteGroupText,favoriteGroup===g&&s.favoriteGroupTextActive]}>{g}</Text></TouchableOpacity>)}</ScrollView><ScrollView contentContainerStyle={s.favoriteList}>{visibleFavorites.map(item=>{const active=favorites.includes(item.id);return<TouchableOpacity key={item.id} onPress={()=>toggleFavorite(item.id)} style={s.favoriteRow}><LinearGradient colors={active?['#315CFF','#F000B8']:['#ececf2','#dedee6']} style={s.favoriteIcon}><Ionicons name={item.icon as any} size={23} color={active?'#fff':'#666'}/></LinearGradient><View style={{flex:1}}><Text style={s.favoriteLabel}>{item.label}</Text><Text style={s.favoriteMeta}>{item.group}</Text></View><Ionicons name={active?'star':'star-outline'} size={25} color={active?'#FFD84D':'#aaa'}/></TouchableOpacity>})}</ScrollView></SafeAreaView></Modal>\n\n  """
          rep(modal_anchor,fav_modal+modal_anchor)

          rep("homeContent:{padding:14,paddingBottom:92}", "homeContent:{padding:14,paddingBottom:92},onliveTopBar:{height:54,backgroundColor:'#09090c',paddingHorizontal:14,flexDirection:'row',alignItems:'center',justifyContent:'space-between'},onLogo:{width:42,height:42,borderRadius:10},favoriteTopButton:{width:38,height:38},favoriteTopRing:{flex:1,borderRadius:19,padding:2},favoriteTopInner:{flex:1,borderRadius:17,backgroundColor:'#09090c',alignItems:'center',justifyContent:'center'}")
          rep("introTitle:{fontSize:21,fontWeight:'800',marginTop:20}", "introTitle:{fontSize:23,fontWeight:'900',marginTop:16,color:'#111'},introTitleAttention:{color:'#6b2cff'}")
          rep("programCardFuture:{opacity:.52}", "programCardFuture:{opacity:.52},programCardLocked:{opacity:.72},programVisual:{width:'100%',height:'100%',alignItems:'center',justifyContent:'center'},visualGlow:{position:'absolute',width:110,height:110,borderRadius:55,backgroundColor:'rgba(255,255,255,.045)'},programTopRight:{alignItems:'flex-end',gap:5},viewerCount:{flexDirection:'row',alignItems:'center',gap:3,paddingHorizontal:2},viewerCountText:{color:'#fff',fontSize:12,fontWeight:'800'}")
          rep("profileModal:{width:'100%',maxWidth:410,backgroundColor:'#fff',borderRadius:28,padding:20,alignItems:'center'}", "profileModal:{width:'100%',maxWidth:410,backgroundColor:'#fff',borderRadius:28,padding:20,alignItems:'center'},favoritesScreen:{flex:1,backgroundColor:'#f6f6f8'},favoritesHeader:{padding:14,flexDirection:'row',alignItems:'center',justifyContent:'space-between'},favoritesTitle:{fontSize:23,fontWeight:'900',textAlign:'center'},favoritesSubtitle:{fontSize:12,color:'#777',textAlign:'center',marginTop:2},favoriteSearchBox:{height:48,marginHorizontal:14,borderRadius:16,backgroundColor:'#fff',paddingHorizontal:13,flexDirection:'row',alignItems:'center',gap:8},favoriteSearchInput:{flex:1,fontSize:15},favoriteGroups:{gap:8,paddingHorizontal:14,paddingVertical:12},favoriteGroupChip:{paddingHorizontal:14,paddingVertical:9,borderRadius:18,backgroundColor:'#e8e8ed'},favoriteGroupChipActive:{backgroundColor:'#16161c'},favoriteGroupText:{fontSize:13,fontWeight:'800',color:'#666'},favoriteGroupTextActive:{color:'#fff'},favoriteList:{paddingHorizontal:14,paddingBottom:30},favoriteRow:{backgroundColor:'#fff',borderRadius:18,padding:12,marginBottom:8,flexDirection:'row',alignItems:'center',gap:12},favoriteIcon:{width:46,height:46,borderRadius:15,alignItems:'center',justifyContent:'center'},favoriteLabel:{fontSize:15,fontWeight:'800',color:'#111'},favoriteMeta:{fontSize:12,color:'#888',marginTop:2}")
          p.write_text(s)
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MainApp.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade Onlive home, favorites and realtime social UI"
          git push

name: Fix Home heading and Onlive count

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-heading-live-count.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Patch MainApp if needed
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/MainApp.tsx')
          s=p.read_text()

          old="<Text style={[s.introTitle,attentionFlash&&s.introTitleAttention]}>Choisis ton programme</Text>"
          new="<Text style={[s.introTitle,attentionFlash&&s.introTitleAttention,{fontWeight:'600'}]}>Choisis ton programme</Text>"
          if old in s:
              s=s.replace(old,new,1)

          old2="<View style={{flexDirection:'row',alignItems:'center',gap:7}}><Text style={[s.sectionTitle,s.liveSectionTitle,{fontWeight:'600'}]}>Ils sont ONLIVE</Text>{liveFriends.length>0&&<View style={{minWidth:20,height:20,paddingHorizontal:6,borderRadius:10,backgroundColor:'rgba(107,44,255,.12)',alignItems:'center',justifyContent:'center'}}><Text style={{fontSize:11,fontWeight:'700',color:'#6b2cff'}}>{liveFriends.length}</Text></View>}</View>"
          new2="<View style={{flexDirection:'row',alignItems:'center',gap:7}}><Text style={[s.sectionTitle,s.liveSectionTitle,{fontWeight:'600'}]}>Ils sont <Text style={{fontWeight:'300',letterSpacing:-1.4}}>on</Text><Text style={{fontWeight:'600',letterSpacing:.2}}>LIVE</Text></Text>{liveFriends.length>0&&<View style={{minWidth:20,height:20,paddingHorizontal:6,borderRadius:10,backgroundColor:'rgba(107,44,255,.12)',alignItems:'center',justifyContent:'center'}}><Text style={{fontSize:11,fontWeight:'700',color:'#6b2cff'}}>{liveFriends.length}</Text></View>}</View>"
          if old2 in s:
              s=s.replace(old2,new2,1)
          elif new2 not in s:
              raise SystemExit('Unexpected Onlive heading markup')

          p.write_text(s)
          PY
      - run: npx tsc --noEmit
      - name: Commit app change if needed
        run: |
          if git diff --quiet; then
            echo "Home heading already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MainApp.tsx
          git commit -m "Style onLIVE heading like brand logo"
          git push

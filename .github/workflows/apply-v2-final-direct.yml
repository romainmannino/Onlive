name: Apply Onlive V2 directly
on:
  push:
    paths:
      - '.github/workflows/apply-v2-final-direct.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply V2 patches to source
        run: |
          node scripts/apply-onlive-v2-fixed.cjs
          node scripts/rename-tv-browsing-je-zappe.cjs
      - name: Commit generated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MainApp.tsx src/Root.tsx src/ChatScreen.tsx
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'Apply Onlive V2 directly to app source'
          git push origin main

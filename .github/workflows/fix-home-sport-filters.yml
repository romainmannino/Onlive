name: Fix home sport filters

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-home-sport-filters.js'
      - '.github/workflows/fix-home-sport-filters.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply focused fix
        run: node scripts/fix-home-sport-filters.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MainApp.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix home sport filters and empty contact text"
          git push

name: Fix Apple review friends stability
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-review-friends-stability.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stabilize demo friends
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/MainApp.tsx')
          s=p.read_text()
          old="useEffect(()=>{if(screen!=='home'||!matches.length)return;refreshLiveFriends(matches);const timer=setInterval(()=>refreshLiveFriends(matches),3000);return()=>clearInterval(timer)},[screen,matches]);"
          new="useEffect(()=>{if(screen!=='home'||!matches.length)return;if(reviewMode){refreshLiveFriends(matches);return}refreshLiveFriends(matches);const timer=setInterval(()=>refreshLiveFriends(matches),3000);return()=>clearInterval(timer)},[screen,matches,selectedProgram,reviewMode]);"
          if old not in s:
              raise SystemExit('Expected friends refresh effect not found')
          s=s.replace(old,new,1)
          old2="useEffect(()=>{\n    if(!userId||screen==='auth')return;"
          new2="useEffect(()=>{\n    if(!userId||screen==='auth'||reviewMode)return;"
          if old2 not in s:
              raise SystemExit('Expected periodic contacts effect not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MainApp.tsx
          git commit -m "Keep Apple review demo friends stable"
          git push

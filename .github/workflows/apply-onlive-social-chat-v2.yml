      - name: Add native permissions and audio dependency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('app.json');d=json.loads(p.read_text());expo=d['expo'];
          expo['ios']['infoPlist']['NSMicrophoneUsageDescription']='Onlive utilise le microphone uniquement lorsque vous enregistrez un message audio dans une discussion.'
          perms=expo['android'].setdefault('permissions',[])
          if 'RECORD_AUDIO' not in perms: perms.append('RECORD_AUDIO')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          npm install expo-av@~16.0.8 --save

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MainApp.tsx src/Root.tsx src/ChatScreen.tsx app.json package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade Onlive presence and persistent chat experience"
          git push

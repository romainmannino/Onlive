name: Apply Onlive social chat v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-onlive-social-chat-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patch MainApp and Root
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/MainApp.tsx')
          s=p.read_text()
          s=s.replace("import React,{useEffect,useMemo,useState}from'react';","import React,{useEffect,useMemo,useRef,useState}from'react';",1)
          s=s.replace("import{Alert,FlatList,Image,Linking,Modal,SafeAreaView,ScrollView,Share,StyleSheet,TouchableOpacity,View,useWindowDimensions,Platform,StatusBar as NativeStatusBar}from'react-native';","import{ActivityIndicator,Alert,Animated,FlatList,Image,Linking,Modal,SafeAreaView,ScrollView,Share,StyleSheet,Switch,TouchableOpacity,View,useWindowDimensions,Platform,StatusBar as NativeStatusBar}from'react-native';",1)

          state_anchor="  const[notifyOpen,setNotifyOpen]=useState(false);"
          if state_anchor not in s: raise SystemExit('MainApp state anchor missing')
          s=s.replace(state_anchor,"  const[tvBrowsing,setTvBrowsing]=useState(false);const[friendsLoading,setFriendsLoading]=useState(true);const presencePulse=useRef(new Animated.Value(1)).current;\n"+state_anchor,1)

          effect_anchor="  useEffect(()=>{if(!userId||reviewMode)return;let cancelled=false;(async()=>{try{const scheduled=await Notifications.getAllScheduledNotificationsAsync();"
          extra="""  useEffect(()=>{const loop=Animated.loop(Animated.sequence([Animated.timing(presencePulse,{toValue:.35,duration:700,useNativeDriver:true}),Animated.timing(presencePulse,{toValue:1,duration:700,useNativeDriver:true})]));loop.start();return()=>loop.stop()},[presencePulse]);
  useEffect(()=>{if(!userId||!tvBrowsing||reviewMode)return;const beat=()=>supabase.from('live_status').update({is_live:true,presence_mode:'browsing',last_seen_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('user_id',userId).then(()=>{});beat();const timer=setInterval(beat,60000);return()=>clearInterval(timer)},[userId,tvBrowsing,reviewMode]);
"""
          if effect_anchor not in s: raise SystemExit('MainApp effect anchor missing')
          s=s.replace(effect_anchor,extra+effect_anchor,1)

          a=s.index("  async function restoreOwnStatus")
          b=s.index("  async function submitAuth",a)
          s=s[:a]+"""  async function restoreOwnStatus(uid:string){const{data}=await supabase.from('live_status').select('is_live,program_id,presence_mode,last_seen_at,updated_at,tv_programs(id,title,channel,category,start_time,program_date,image_url,is_live)').eq('user_id',uid).maybeSingle();const mode=(data as any)?.presence_mode||((data as any)?.is_live?((data as any)?.program_id?'watching':'browsing'):'off');const seen=(data as any)?.last_seen_at||(data as any)?.updated_at;const browsingFresh=mode==='browsing'&&seen&&Date.now()-new Date(seen).getTime()<2*60*60*1000;if(mode==='browsing'&&browsingFresh){setTvBrowsing(true);setSelectedProgram(null);return}if(mode==='browsing'&&!browsingFresh){setTvBrowsing(false);await supabase.from('live_status').update({is_live:false,presence_mode:'off',program_id:null,started_at:null,updated_at:new Date().toISOString()}).eq('user_id',uid);return}const p:any=(data as any)?.tv_programs;if((data as any)?.is_live&&mode==='watching'&&p){const restored={id:p.id,title:p.title,channel:p.channel,category:p.category,time:String(p.start_time).slice(0,5),image:p.image_url||'',isLive:Boolean(p.is_live)} as Program;const start=p.program_date&&p.start_time?new Date(`${p.program_date}T${String(p.start_time).slice(0,8)}`).getTime():NaN;const expired=Number.isFinite(start)?Date.now()>start+4*60*60*1000:programState(restored)==='expired';if(!expired){setSelectedProgram(restored);setTvBrowsing(false)}else await supabase.from('live_status').update({is_live:false,presence_mode:'off',program_id:null,started_at:null,updated_at:new Date().toISOString()}).eq('user_id',uid)}else{setTvBrowsing(false);setSelectedProgram(null)}}
"""+s[b:]

          a=s.index("  async function refreshLiveFriends")
          b=s.index("\n\n  async function chooseProgram",a)
          s=s[:a]+"""  async function refreshLiveFriends(list=matches){if(reviewMode){if(!selectedProgram&&!tvBrowsing){setLiveFriends([]);setFriendsLoading(false);return}setLiveFriends([{...list[0],programId:selectedProgram?.id||null,program:selectedProgram?.title||'',channel:selectedProgram?.channel||'',since:'depuis 12 min'},{...list[1],programId:selectedProgram?.id||null,program:selectedProgram?.title||'',channel:selectedProgram?.channel||'',since:'depuis 8 min'},{...list[2],programId:selectedProgram?.id||null,program:selectedProgram?.title||'',channel:selectedProgram?.channel||'',since:'depuis 4 min'}]);setFriendsLoading(false);return}if(!list.length){setLiveFriends([]);setFriendsLoading(false);return}const{data,error}=await supabase.from('live_status').select('user_id,program_id,is_live,started_at,presence_mode,last_seen_at,updated_at,tv_programs(title,channel,start_time,program_date)').in('user_id',list.map(x=>x.userId)).eq('is_live',true);if(error){setFriendsLoading(false);return}const nowMs=Date.now();setLiveFriends((data||[]).flatMap((r:any)=>{const m=list.find(x=>x.userId===r.user_id);if(!m)return[];const mode=r.presence_mode||(r.program_id?'watching':'browsing');const seen=r.last_seen_at||r.updated_at;const freshBrowsing=mode==='browsing'&&seen&&nowMs-new Date(seen).getTime()<2*60*60*1000;if(mode==='browsing'){if(!freshBrowsing)return[];const mins=seen?Math.max(0,Math.floor((nowMs-new Date(seen).getTime())/60000)):0;return[{...m,programId:null,program:'',channel:'',since:`depuis ${mins} min`}]};if(mode!=='watching'||!r.program_id)return[];const mins=r.started_at?Math.max(0,Math.floor((nowMs-new Date(r.started_at).getTime())/60000)):0;const pd=r.tv_programs?.program_date,pt=r.tv_programs?.start_time;if(pd&&pt){const start=new Date(`${pd}T${String(pt).slice(0,8)}`).getTime();if(Number.isFinite(start)&&nowMs>start+4*60*60*1000)return[]}else if(mins>=240)return[];return[{...m,programId:r.program_id||null,program:r.tv_programs?.title||'Programme',channel:r.tv_programs?.channel||'',since:`depuis ${mins} min`,startTime:pt?String(pt).slice(0,5):undefined}]}));setFriendsLoading(false)}
"""+s[b:]

          a=s.index("  async function chooseProgram")
          b=s.index("  async function bumpScore",a)
          s=s[:a]+"""  async function setBrowsingPresence(active:boolean){if(!userId)return;if(active){const nowIso=new Date().toISOString();const{error}=await supabase.from('live_status').upsert({user_id:userId,program_id:null,is_live:true,presence_mode:'browsing',started_at:nowIso,last_seen_at:nowIso,updated_at:nowIso},{onConflict:'user_id'});if(error)return Alert.alert('Statut impossible',error.message);setSelectedProgram(null);setTvBrowsing(true)}else{const{error}=await supabase.from('live_status').upsert({user_id:userId,program_id:null,is_live:false,presence_mode:'off',started_at:null,last_seen_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)return Alert.alert('Statut impossible',error.message);setTvBrowsing(false);setSelectedProgram(null)}}
  async function chooseProgram(program:Program){if(!userId)return;setProgramGuideOpen(false);if(selectedProgram?.id===program.id)return goOfflive();if(!programSelectable(program,now))return Alert.alert('Programme à venir',`Tu pourras te positionner Onlive 15 minutes avant ${program.time}.`);if(reviewMode){setTvBrowsing(false);setSelectedProgram(program);onReviewProgramChange?.({id:program.id,title:program.title,channel:program.channel});const demo:Match[]=[{userId:'review-demo-alexandre',name:'Alexandre R.',phone:'+33900000001'},{userId:'review-demo-thomas',name:'Thomas Dupont',phone:'+33900000002'},{userId:'review-demo-papa',name:'Papa',phone:'+33900000003'}];setLiveFriends(demo.map((m,i)=>({...m,programId:program.id,program:program.title,channel:program.channel,since:`depuis ${12-i*4} min`})));return}if(programSource!=='supabase')return Alert.alert('Programme de démonstration','Reconnecte-toi avec internet pour publier un vrai statut.');const nowIso=new Date().toISOString();const{error}=await supabase.from('live_status').upsert({user_id:userId,program_id:program.id,is_live:true,presence_mode:'watching',started_at:nowIso,last_seen_at:nowIso,updated_at:nowIso},{onConflict:'user_id'});if(error)return Alert.alert('Impossible de passer Onlive',error.message);setTvBrowsing(false);setSelectedProgram(program)}
  async function goOfflive(){if(reviewMode){setSelectedProgram(null);setTvBrowsing(false);setLiveFriends([]);onReviewProgramChange?.(null);return}if(userId){const{error}=await supabase.from('live_status').upsert({user_id:userId,program_id:null,is_live:false,presence_mode:'off',started_at:null,last_seen_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)return Alert.alert('Impossible de passer Offlive',error.message)}setSelectedProgram(null);setTvBrowsing(false)}
"""+s[b:]

          old="const canChat=Boolean(selectedProgram&&f.programId===selectedProgram.id);"
          if old not in s: raise SystemExit('canChat anchor missing')
          s=s.replace(old,"const canChat=Boolean(tvBrowsing||(selectedProgram&&(f.programId===selectedProgram.id||!f.programId)));",1)
          old="if(!selectedProgram){setAttentionFlash(true);setTimeout(()=>setAttentionFlash(false),3000);return}"
          new="if(!selectedProgram){if(f.programId){Alert.alert('Rejoindre le même programme',`Pour discuter avec ${f.name}, sélectionne le même programme : « ${f.program} ».`,[{text:'Rester sans programme',style:'cancel'},{text:`Rejoindre « ${f.program} »`,onPress:async()=>{const friendProgram=programs.find(p=>p.id===f.programId);if(!friendProgram)return Alert.alert('Programme indisponible','Ce programme n’est plus disponible.');await chooseProgram(friendProgram);onStartChat?.(target)}}]);return}Alert.alert('Passer Onlive',`Pour discuter avec ${f.name}, indique que tu es devant la TV.`,[{text:'Rester Offlive',style:'cancel'},{text:'Je suis devant la TV',onPress:async()=>{await setBrowsingPresence(true);onStartChat?.(target)}}]);return}"
          if old not in s: raise SystemExit('no program popup anchor missing')
          s=s.replace(old,new,1)

          old="<View style={s.scrollLogoHeader}><Image source={LOGO_ON} resizeMode=\"contain\" style={[s.onLogo,Platform.OS==='android'&&{transform:[{translateY:8}]}]}/></View>"
          new="<View style={s.scrollLogoHeader}><Image source={LOGO_ON} resizeMode=\"contain\" style={[s.onLogo,Platform.OS==='android'&&{transform:[{translateY:8}]}]}/><View style={s.topPresence}>{(selectedProgram||tvBrowsing)?<><Animated.View style={{opacity:presencePulse}}><LinearGradient colors={['#4932ff','#ed00b3']} style={s.topPresenceDot}/></Animated.View><Text style={s.topPresenceOn}>ONLIVE</Text></>:<><View style={[s.topPresenceDot,{backgroundColor:'#b8b8bf'}]}/><Text style={s.topPresenceOff}>OFFLIVE</Text></>}</View></View>"
          if old not in s: raise SystemExit('logo header anchor missing')
          s=s.replace(old,new,1)

          old="</View><TouchableOpacity accessibilityLabel=\"Mes favoris\" onPress={()=>setFavoritesOpen(true)}"
          new="</View>{selectedProgram&&<TouchableOpacity accessibilityLabel=\"Quitter ce programme\" onPress={goOfflive} style={s.leaveProgramButton}><Ionicons name=\"close-circle\" size={21} color=\"#e32b45\"/></TouchableOpacity>}<TouchableOpacity accessibilityLabel=\"Mes favoris\" onPress={()=>setFavoritesOpen(true)}"
          if old not in s: raise SystemExit('favorite header anchor missing')
          s=s.replace(old,new,1)

          old="}}/>{programGuideOpen&&"
          new="}}/><View style={s.tvPresenceRow}><Text style={s.tvPresenceLabel}>Je suis devant la TV</Text><Switch value={tvBrowsing&&!selectedProgram} onValueChange={v=>setBrowsingPresence(v)} disabled={Boolean(selectedProgram)} trackColor={{false:'#d8d8de',true:'#b9a6ff'}} thumbColor={tvBrowsing&&!selectedProgram?'#6b2cff':'#f4f4f6'}/></View>{programGuideOpen&&"
          if old not in s: raise SystemExit('featured list anchor missing')
          s=s.replace(old,new,1)

          old="{sortedLiveFriends.length?<View style={s.friendsCard}>"
          new="{friendsLoading&&!sortedLiveFriends.length?<View style={s.emptyFriends}><ActivityIndicator size=\"small\" color=\"#6b2cff\"/><Text style={[s.emptyTitle,{fontWeight:'500',marginTop:8}]}>ONLIVE</Text></View>:sortedLiveFriends.length?<View style={s.friendsCard}>"
          if old not in s: raise SystemExit('friends loading anchor missing')
          s=s.replace(old,new,1)

          s=s.replace("<Text style={s.friendSummaryMeta}> {f.startTime&&(()=>{const[h,m]=f.startTime.split(':').map(Number);const d=new Date();d.setHours(h||0,m||0,0,0);return Date.now()<d.getTime()})()?'va regarder':'regarde'} {f.channel} · {f.since}</Text>","<Text style={s.friendSummaryMeta}> {f.programId?`${f.startTime&&(()=>{const[h,m]=f.startTime.split(':').map(Number);const d=new Date();d.setHours(h||0,m||0,0,0);return Date.now()<d.getTime()})()?'va regarder':'regarde'} ${f.channel}`:'est devant la TV'} · {f.since}</Text>",1)
          s=s.replace("<Text style={s.friendProgramCompact} numberOfLines={1} ellipsizeMode=\"tail\">« {f.program} »</Text>","{f.programId&&<Text style={s.friendProgramCompact} numberOfLines={1} ellipsizeMode=\"tail\">« {f.program} »</Text>}",1)

          style_anchor=" favoriteTopButton:{width:34,height:34,alignItems:'center',justifyContent:'center'},"
          if style_anchor not in s: raise SystemExit('style anchor missing')
          s=s.replace(style_anchor,style_anchor+"leaveProgramButton:{width:30,height:34,alignItems:'center',justifyContent:'center'},topPresence:{position:'absolute',right:13,top:17,flexDirection:'row',alignItems:'center',gap:5},topPresenceDot:{width:9,height:9,borderRadius:5},topPresenceOn:{fontSize:9.5,fontWeight:'800',color:'#6b2cff'},topPresenceOff:{fontSize:9.5,fontWeight:'700',color:'#999'},tvPresenceRow:{minHeight:44,marginTop:8,marginBottom:4,paddingHorizontal:2,flexDirection:'row',alignItems:'center',justifyContent:'space-between'},tvPresenceLabel:{fontSize:15,fontWeight:'700',color:'#111'},",1)
          p.write_text(s)

          p=Path('src/Root.tsx')
          r=p.read_text()
          a=r.index(" const startChat=async(target:ChatTarget)=>")
          b=r.index(" const goHome=",a)
          r=r[:a]+""" const startChat=async(target:ChatTarget)=>{if(reviewMode&&target.userId.startsWith('review-demo-')){setProfileOpenSignal(0);setNotificationRoomId(null);setChatTarget(target);setMode('chat');return}if(!userId)return;const{data:mine}=await supabase.from('live_status').select('is_live,program_id,presence_mode,last_seen_at,updated_at').eq('user_id',userId).maybeSingle();const{data:theirs}=await supabase.from('live_status').select('is_live,program_id,presence_mode,last_seen_at,updated_at').eq('user_id',target.userId).maybeSingle();const effective=(v:any)=>{if(!v?.is_live)return'off';const mode=v.presence_mode||(v.program_id?'watching':'browsing');if(mode==='browsing'){const seen=v.last_seen_at||v.updated_at;if(!seen||Date.now()-new Date(seen).getTime()>=2*60*60*1000)return'off'}return mode};const myMode=effective(mine),theirMode=effective(theirs);if(myMode==='off')return Alert.alert('Tu es Offlive','Choisis un programme ou active « Je suis devant la TV » pour démarrer une discussion.');if(theirMode==='off')return Alert.alert('Proche Offlive',`${target.name} n’est plus Onlive.`);if(myMode==='watching'&&theirMode==='watching'&&mine?.program_id!==theirs?.program_id)return Alert.alert('Programme différent',`Pour démarrer une nouvelle discussion avec ${target.name}, vous devez regarder le même programme.`);setProfileOpenSignal(0);setNotificationRoomId(null);setChatTarget(target);setMode('chat')};
"""+r[b:]
          p.write_text(r)
          PY

      - name: Replace chat screen
        run: |
          cat > src/ChatScreen.tsx <<'EOF'
          import React,{useEffect,useMemo,useRef,useState}from'react';
          import{Text,TextInput}from'./Typography';
          import{Alert,FlatList,Image,Keyboard,KeyboardAvoidingView,Linking,Platform,SafeAreaView,StyleSheet,TouchableOpacity,View}from'react-native';
          import{Ionicons}from'@expo/vector-icons';
          import{LinearGradient}from'expo-linear-gradient';
          import*as Contacts from'expo-contacts';
          import*as ImagePicker from'expo-image-picker';
          import{Audio}from'expo-av';
          import{supabase}from'./supabase';
          import{pushChatInvite,pushChatMessage}from'./notifications';
          import ReviewChatScreen from'./ReviewChatScreen';

          type KnownPerson={userId:string;name:string;image?:string};
          type ChatTarget={userId:string;name:string;programId:string|null;programTitle:string;channel:string};
          type Room={room_id:string;program_id:string|null;program_title:string;member_ids:string[];last_message:string|null;last_message_at:string|null;unread_count:number};
          type Msg={id:string;sender_id:string;body:string;created_at:string;message_type:'text'|'image'|'video'|'audio';media_url?:string|null;media_name?:string|null;media_mime?:string|null;signed_url?:string|null};
          const normalizePhone=(value='')=>{let p=value.replace(/[^\d+]/g,'');if(p.startsWith('0033'))p='+33'+p.slice(4);if(p.startsWith('0'))p='+33'+p.slice(1);if(!p.startsWith('+')&&p.length===9)p='+33'+p;return p};
          const messageTime=(value:string|null)=>{if(!value)return'';const d=new Date(value);return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}).replace(':','h')};
          const activityTime=(value:string|null)=>{if(!value)return'';const d=new Date(value),now=new Date();const start=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),day=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();if(day===start)return messageTime(value);if(day===start-86400000)return'Hier';return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})};

          export default function ChatScreen({userId,initialTarget,initialRoomId,unreadCount,onUnreadChange,onBack,onHome,onContacts,onProfile,profileAvatar,profileInitials,reviewMode=false,reviewProgram}:{userId:string;initialTarget:ChatTarget|null;initialRoomId?:string|null;unreadCount:number;onUnreadChange:(n:number)=>void;onBack:()=>void;onHome:()=>void;onContacts:()=>void;onProfile:()=>void;profileAvatar:string|null;profileInitials:string;reviewMode?:boolean;reviewProgram?:{id:string;title:string;channel:string}|null}){
           if(reviewMode)return<ReviewChatScreen initialTarget={initialTarget} reviewProgram={reviewProgram||null} onBack={onBack} onHome={onHome} onContacts={onContacts} onProfile={onProfile} profileAvatar={profileAvatar} profileInitials={profileInitials}/>;
           const[rooms,setRooms]=useState<Room[]>([]),[roomId,setRoomId]=useState<string|null>(initialRoomId||null),[messages,setMessages]=useState<Msg[]>([]),[text,setText]=useState(''),[inviteOpen,setInviteOpen]=useState(false),[knownPeople,setKnownPeople]=useState<KnownPerson[]>([]),[currentPresence,setCurrentPresence]=useState<{mode:'off'|'watching'|'browsing';programId:string|null;title:string;channel:string}>({mode:'off',programId:null,title:'',channel:''}),[recording,setRecording]=useState<Audio.Recording|null>(null),[mediaBusy,setMediaBusy]=useState(false);
           const startedRef=useRef(false);const listRef=useRef<FlatList<Msg>>(null);
           const names=useMemo(()=>new Map(knownPeople.map(p=>[p.userId,p.name])),[knownPeople]);
           const active=rooms.find(r=>r.room_id===roomId)||null;
           const currentRooms=useMemo(()=>currentPresence.mode==='watching'?rooms.filter(r=>r.program_id===currentPresence.programId):currentPresence.mode==='browsing'?rooms:[],[rooms,currentPresence]);
           const otherRooms=useMemo(()=>currentPresence.mode==='watching'?rooms.filter(r=>r.program_id!==currentPresence.programId):currentPresence.mode==='browsing'?[]:rooms,[rooms,currentPresence]);
           useEffect(()=>{loadPeople();loadRooms()},[]);
           useEffect(()=>{if(initialRoomId){setRoomId(initialRoomId);startedRef.current=true}},[initialRoomId]);
           useEffect(()=>{if(initialTarget&&!startedRef.current){startedRef.current=true;start(initialTarget)}},[initialTarget]);
           useEffect(()=>{if(!roomId)return;openRoom(roomId);const t=setInterval(()=>openRoom(roomId),1200);return()=>clearInterval(t)},[roomId]);
           useEffect(()=>{const t=setInterval(loadRooms,2000);return()=>clearInterval(t)},[]);
           useEffect(()=>{if(!roomId)return;const scroll=()=>setTimeout(()=>listRef.current?.scrollToEnd({animated:true}),80);const a=Keyboard.addListener('keyboardDidShow',scroll);const b=Keyboard.addListener('keyboardWillShow',scroll);return()=>{a.remove();b.remove()}},[roomId]);

           async function loadPeople(){const perm=await Contacts.getPermissionsAsync();if(perm.status!=='granted')return;const{data}=await Contacts.getContactsAsync({fields:[Contacts.Fields.PhoneNumbers]});const local=new Map<string,string>();data.forEach(c=>(c.phoneNumbers||[]).forEach(n=>{const p=normalizePhone(n.number||'');if(p)local.set(p,c.name||'Contact')}));const phones=[...local.keys()],rows:any[]=[];for(let i=0;i<phones.length;i+=300){const{data:found}=await supabase.rpc('match_contact_phones',{phone_list:phones.slice(i,i+300)});rows.push(...(found||[]))}setKnownPeople(rows.flatMap((r:any)=>{const phone=normalizePhone(r.phone_e164||''),name=local.get(phone);return name?[{userId:r.user_id,name}]:[]}))}
           async function loadRooms(){const{data:status}=await supabase.from('live_status').select('is_live,program_id,presence_mode,last_seen_at,updated_at,tv_programs(title,channel)').eq('user_id',userId).maybeSingle();let mode:any=(status as any)?.presence_mode||((status as any)?.is_live?((status as any)?.program_id?'watching':'browsing'):'off');if(mode==='browsing'){const seen=(status as any)?.last_seen_at||(status as any)?.updated_at;if(!seen||Date.now()-new Date(seen).getTime()>=2*60*60*1000)mode='off'}const programId=mode==='watching'?(status as any)?.program_id:null;setCurrentPresence({mode,programId:programId?String(programId):null,title:(status as any)?.tv_programs?.title||'',channel:(status as any)?.tv_programs?.channel||''});const{data}=await supabase.rpc('my_chat_rooms_v2');setRooms(((data||[])as Room[]).map(r=>({...r,unread_count:Number(r.unread_count)||0})));const{data:count}=await supabase.rpc('chat_unread_count');onUnreadChange(Number(count)||0)}
           async function openRoom(id:string){await supabase.rpc('mark_chat_read',{p_room_id:id});const{data}=await supabase.rpc('chat_messages_for',{p_room_id:id});const rows=((data||[])as Msg[]);const enriched=await Promise.all(rows.map(async m=>{if(!m.media_url)return m;const{data:signed}=await supabase.storage.from('chat-media').createSignedUrl(m.media_url,3600);return{...m,signed_url:signed?.signedUrl||null}}));setMessages(enriched);const{data:count}=await supabase.rpc('chat_unread_count');onUnreadChange(Number(count)||0)}
           async function start(p:ChatTarget){const{data,error}=await supabase.rpc('start_chat_with',{target_user:p.userId,p_program_id:p.programId,p_program_title:p.programTitle||'Discussion Onlive'});if(error)return Alert.alert('Discussion impossible',error.message);await loadRooms();setRoomId(data as string)}
           async function send(){const body=text.trim();if(!body||!roomId)return;const{error}=await supabase.rpc('send_chat_message_v2',{p_room_id:roomId,p_body:body,p_message_type:'text'});if(error)return Alert.alert('Message impossible',error.message);pushChatMessage(roomId,body).then(({error:e})=>{if(e)console.warn('Push chat message',e.message)}).catch(()=>{});setText('');await openRoom(roomId);setTimeout(()=>listRef.current?.scrollToEnd({animated:true}),80)}
           async function uploadAttachment(uri:string,type:'image'|'video'|'audio',name?:string,mime?:string){if(!roomId||mediaBusy)return;setMediaBusy(true);try{const arrayBuffer=await fetch(uri).then(r=>r.arrayBuffer());const ext=(name?.split('.').pop()||uri.split('.').pop()||(type==='image'?'jpg':type==='video'?'mp4':'m4a')).replace(/[^a-zA-Z0-9]/g,'').toLowerCase();const objectPath=`${userId}/${roomId}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const contentType=mime||(type==='image'?'image/jpeg':type==='video'?'video/mp4':'audio/mp4');const{error:up}=await supabase.storage.from('chat-media').upload(objectPath,arrayBuffer,{contentType,upsert:false});if(up)throw up;const{error}=await supabase.rpc('send_chat_message_v2',{p_room_id:roomId,p_body:'',p_message_type:type,p_media_url:objectPath,p_media_name:name||null,p_media_mime:contentType});if(error)throw error;await openRoom(roomId);setTimeout(()=>listRef.current?.scrollToEnd({animated:true}),80)}catch(e:any){Alert.alert('Envoi impossible',e?.message||'Impossible d’envoyer ce média.')}finally{setMediaBusy(false)}}
           async function pickMedia(){if(!roomId||mediaBusy)return;const perm=await ImagePicker.requestMediaLibraryPermissionsAsync();if(!perm.granted)return Alert.alert('Accès aux photos','Autorise Onlive à accéder à tes photos et vidéos.');const result=await ImagePicker.launchImageLibraryAsync({mediaTypes:ImagePicker.MediaTypeOptions.All,allowsEditing:false,quality:.8,videoMaxDuration:60});if(result.canceled||!result.assets?.[0])return;const asset=result.assets[0];await uploadAttachment(asset.uri,asset.type==='video'?'video':'image',asset.fileName||undefined,asset.mimeType||undefined)}
           async function toggleRecording(){if(!roomId||mediaBusy)return;if(recording){setMediaBusy(true);try{await recording.stopAndUnloadAsync();const uri=recording.getURI();setRecording(null);await Audio.setAudioModeAsync({allowsRecordingIOS:false,playsInSilentModeIOS:true});if(uri)await uploadAttachment(uri,'audio','audio-onlive.m4a','audio/mp4')}catch(e:any){setRecording(null);Alert.alert('Audio impossible',e?.message||'Impossible d’envoyer cet audio.')}finally{setMediaBusy(false)}return}const perm=await Audio.requestPermissionsAsync();if(!perm.granted)return Alert.alert('Microphone','Autorise Onlive à utiliser le microphone pour envoyer un message audio.');try{await Audio.setAudioModeAsync({allowsRecordingIOS:true,playsInSilentModeIOS:true});const rec=new Audio.Recording();await rec.prepareToRecordAsync(Audio.RecordingOptionsPresets.HIGH_QUALITY);await rec.startAsync();setRecording(rec)}catch(e:any){Alert.alert('Microphone impossible',e?.message||'Impossible de démarrer l’enregistrement.')}}
           async function playAudio(url?:string|null){if(!url)return;try{const{sound}=await Audio.Sound.createAsync({uri:url},{shouldPlay:true});sound.setOnPlaybackStatusUpdate((st:any)=>{if(st?.didJustFinish)sound.unloadAsync().catch(()=>{})})}catch{Linking.openURL(url).catch(()=>{})}}
           async function invite(p:KnownPerson){if(!roomId)return;const{error}=await supabase.rpc('invite_chat_member',{p_room_id:roomId,p_user_id:p.userId});if(error)return Alert.alert('Invitation impossible',error.message);pushChatInvite(roomId,p.userId).then(({error:e})=>{if(e)console.warn('Push chat invite',e.message)}).catch(()=>{});setInviteOpen(false);loadRooms()}
           function reportSafety(){if(!roomId)return;Alert.alert('Signaler un problème de sécurité','Utilise ce signalement pour tout contenu ou comportement préoccupant, notamment concernant la sécurité des enfants. Le signalement sera transmis à Onlive pour examen.',[{text:'Annuler',style:'cancel'},{text:'Envoyer le signalement',style:'destructive',onPress:async()=>{const{error}=await supabase.from('safety_reports').insert({reporter_id:userId,room_id:roomId,category:'child_safety'});if(error)return Alert.alert('Signalement impossible','Réessaie dans quelques instants.');Alert.alert('Signalement envoyé','Merci. Onlive examinera ce signalement dans les meilleurs délais.')}}])}
           const label=(ids:string[])=>{const o=ids.filter(id=>id!==userId),v=o.slice(0,2).map(id=>names.get(id)||'Participant');return['Moi',...v].join(', ')+(o.length>2?` +${o.length-2}`:'')};
           const roomRow=(item:Room,muted=false)=><TouchableOpacity key={item.room_id} onPress={()=>setRoomId(item.room_id)} style={[s.room,muted&&s.roomMuted]}><View style={{flex:1,minWidth:0}}><Text numberOfLines={1} ellipsizeMode="tail" style={s.people}>{label(item.member_ids)}</Text>{item.program_title&&item.program_title!=='Discussion Onlive'&&<Text numberOfLines={1} style={s.roomProgram}>{item.program_title}</Text>}<Text numberOfLines={1} ellipsizeMode="tail" style={s.preview}>{item.last_message||'Nouvelle discussion'}</Text></View><View style={s.roomMeta}><Text style={s.roomTime}>{activityTime(item.last_message_at)}</Text>{item.unread_count>0&&<View style={s.roomBadge}><Text style={s.badgeText}>{item.unread_count>99?'99+':item.unread_count}</Text></View>}</View><Ionicons name="chevron-forward" size={17} color="#c0c0c5"/></TouchableOpacity>;
           if(!roomId)return<SafeAreaView style={s.screen}><View style={s.head}><TouchableOpacity onPress={onBack} style={s.round}><Ionicons name="chevron-back" size={23}/></TouchableOpacity><Text style={s.title}>Discussions</Text><View style={{width:42}}/></View>{currentPresence.mode==='watching'?<View style={s.currentProgramBlock}><Text numberOfLines={1} style={s.currentProgram}>{currentPresence.title}</Text><Text style={s.currentChannel}>{currentPresence.channel}</Text></View>:currentPresence.mode==='browsing'?<Text style={s.currentProgramOff}>Tu es Onlive · devant la TV</Text>:<Text style={s.currentProgramOff}>Tu es Offlive · tes discussions restent accessibles.</Text>}<FlatList data={[{key:'all'}]} keyExtractor={x=>x.key} contentContainerStyle={s.list} renderItem={()=> <>{currentRooms.length>0&&<View><Text style={s.sectionLabel}>{currentPresence.mode==='watching'?'Programme en cours':'Discussions Onlive'}</Text>{currentRooms.map(r=>roomRow(r,false))}</View>}{otherRooms.length>0&&<View style={{marginTop:currentRooms.length?10:0}}><Text style={s.sectionLabelMuted}>Autres discussions</Text>{otherRooms.map(r=>roomRow(r,true))}</View>}{!rooms.length&&<View style={s.empty}><Ionicons name="chatbubbles-outline" size={28} color="#6b2cff"/><Text style={s.emptyTitle}>Aucune discussion pour le moment</Text><Text style={s.emptyText}>Démarre une discussion depuis l’Accueil avec un proche Onlive.</Text></View>}</>}/><BottomNav unreadCount={unreadCount} onHome={onHome} onContacts={onContacts} onProfile={onProfile} profileAvatar={profileAvatar} profileInitials={profileInitials}/></SafeAreaView>;
           return<SafeAreaView style={s.screen}><KeyboardAvoidingView style={s.chatLayout} behavior={Platform.OS==='ios'?'padding':'height'} keyboardVerticalOffset={Platform.OS==='ios'?4:0}><View style={s.head}><TouchableOpacity onPress={()=>{setRoomId(null);loadRooms()}} style={s.round}><Ionicons name="chevron-back" size={23}/></TouchableOpacity><View style={s.chatHeadText}><Text numberOfLines={1} style={s.chatTitle}>{active?.program_title||initialTarget?.programTitle||'Discussion Onlive'}</Text><Text numberOfLines={1} style={s.chatSub}>{active?label(active.member_ids):`Moi, ${initialTarget?.name||'Participant'}`}</Text></View><View style={s.headActions}><TouchableOpacity onPress={reportSafety} style={s.round}><Ionicons name="warning-outline" size={21} color="#d32f2f"/></TouchableOpacity><TouchableOpacity onPress={()=>setInviteOpen(v=>!v)} style={s.round}><Ionicons name="person-add-outline" size={21}/></TouchableOpacity></View></View>{inviteOpen&&<View style={s.invite}><FlatList horizontal data={knownPeople.filter(p=>!active?.member_ids.includes(p.userId))} keyExtractor={p=>p.userId} renderItem={({item})=><TouchableOpacity onPress={()=>invite(item)} style={s.person}><Text style={s.personName}>{item.name}</Text></TouchableOpacity>}/></View>}<FlatList ref={listRef} data={messages} keyExtractor={m=>m.id} style={s.messageList} contentContainerStyle={s.messages} keyboardShouldPersistTaps="handled" onContentSizeChange={()=>listRef.current?.scrollToEnd({animated:false})} renderItem={({item})=>{const mine=item.sender_id===userId;return<View style={[s.wrap,mine&&{alignItems:'flex-end'}]}><Text style={s.sender}>{mine?'Moi':names.get(item.sender_id)||'Participant'}</Text><View style={[s.bubble,mine&&s.mine,item.message_type!=='text'&&s.mediaBubble]}>{item.message_type==='image'&&item.signed_url?<TouchableOpacity onPress={()=>Linking.openURL(item.signed_url!)}><Image source={{uri:item.signed_url}} style={s.chatImage}/></TouchableOpacity>:item.message_type==='video'?<TouchableOpacity onPress={()=>item.signed_url&&Linking.openURL(item.signed_url)} style={s.mediaCard}><Ionicons name="play-circle" size={34} color={mine?'#fff':'#6b2cff'}/><Text style={[s.mediaLabel,mine&&{color:'#fff'}]}>Vidéo</Text></TouchableOpacity>:item.message_type==='audio'?<TouchableOpacity onPress={()=>playAudio(item.signed_url)} style={s.mediaCard}><Ionicons name="play" size={25} color={mine?'#fff':'#6b2cff'}/><Text style={[s.mediaLabel,mine&&{color:'#fff'}]}>Message audio</Text></TouchableOpacity>:<Text style={[s.body,mine&&{color:'#fff'}]}>{item.body}</Text>}<Text style={[s.messageTime,mine&&s.messageTimeMine]}>{messageTime(item.created_at)}</Text></View></View>}}/><View style={s.composer}><TouchableOpacity disabled={mediaBusy||Boolean(recording)} onPress={pickMedia} style={s.attach}><Ionicons name="add" size={25} color="#6b2cff"/></TouchableOpacity><TextInput value={text} onChangeText={setText} onFocus={()=>setTimeout(()=>listRef.current?.scrollToEnd({animated:true}),100)} placeholder={recording?'Enregistrement audio…':'Message…'} style={s.input} multiline blurOnSubmit={false} autoCorrect spellCheck autoCapitalize="sentences" editable={!recording}/><TouchableOpacity disabled={mediaBusy} onPress={toggleRecording} style={[s.mic,recording&&s.micRecording]}><Ionicons name={recording?'stop':'mic-outline'} size={20} color={recording?'#fff':'#6b2cff'}/></TouchableOpacity><TouchableOpacity disabled={!text.trim()||mediaBusy||Boolean(recording)} onPress={send} style={{opacity:text.trim()&&!recording?1:.4}}><LinearGradient colors={['#4932ff','#ed00b3']} style={s.send}><Ionicons name="arrow-up" size={20} color="#fff"/></LinearGradient></TouchableOpacity></View></KeyboardAvoidingView></SafeAreaView>
          }
          function BottomNav({unreadCount,onHome,onContacts,onProfile,profileAvatar,profileInitials}:{unreadCount:number;onHome:()=>void;onContacts:()=>void;onProfile:()=>void;profileAvatar:string|null;profileInitials:string}){return<View style={s.bottomWrap}><View style={s.bottom}><TouchableOpacity onPress={onHome} style={s.nav}><Ionicons name="home-outline" size={21} color="#6b2cff"/><Text style={s.navText}>Accueil</Text></TouchableOpacity><LinearGradient colors={['#4932ff','#ed00b3']} style={[s.nav,s.navSelected]}><View><Ionicons name="chatbubbles" size={21} color="#fff"/>{unreadCount>0&&<View style={s.navBadge}><Text style={s.navBadgeText}>{unreadCount>99?'99+':unreadCount}</Text></View>}</View><Text style={s.navActive}>Discussions</Text></LinearGradient><TouchableOpacity onPress={onContacts} style={s.nav}><Ionicons name="people-outline" size={22} color="#d700b0"/><Text style={[s.navText,{color:'#d700b0'}]}>Contacts</Text></TouchableOpacity><TouchableOpacity onPress={onProfile} style={s.nav}>{profileAvatar?<Image source={{uri:profileAvatar}} style={s.navAvatar}/>:<View style={s.navInitialCircle}><Text style={s.navInitialText}>{profileInitials}</Text></View>}<Text style={[s.navText,{color:'#555'}]}>Compte</Text></TouchableOpacity></View></View>}
          const s=StyleSheet.create({screen:{flex:1,backgroundColor:'#f6f6f8'},chatLayout:{flex:1},head:{height:64,paddingHorizontal:14,flexDirection:'row',alignItems:'center',justifyContent:'space-between'},headActions:{flexDirection:'row',alignItems:'center',gap:8},round:{width:42,height:42,borderRadius:21,backgroundColor:'#fff',alignItems:'center',justifyContent:'center'},title:{fontSize:21,fontWeight:'900'},currentProgramBlock:{marginHorizontal:18,marginTop:-2,marginBottom:8},currentProgram:{fontSize:15,color:'#6b2cff',fontWeight:'800'},currentChannel:{fontSize:12,color:'#888',marginTop:2},currentProgramOff:{fontSize:13,color:'#777',marginHorizontal:18,marginTop:-2,marginBottom:8},list:{paddingHorizontal:14,paddingTop:4,paddingBottom:92},sectionLabel:{fontSize:12,fontWeight:'900',color:'#555',textTransform:'uppercase',marginBottom:7,marginLeft:2},sectionLabelMuted:{fontSize:12,fontWeight:'900',color:'#999',textTransform:'uppercase',marginBottom:7,marginLeft:2},empty:{backgroundColor:'#fff',borderRadius:18,padding:22,alignItems:'center',marginTop:10},emptyTitle:{fontSize:16,fontWeight:'700',marginTop:7},emptyText:{fontSize:13,color:'#777',textAlign:'center',marginTop:5},room:{backgroundColor:'#fff',borderRadius:16,paddingHorizontal:14,paddingVertical:11,marginBottom:7,flexDirection:'row',alignItems:'center',gap:8},roomMuted:{opacity:.56},roomProgram:{fontSize:11.5,color:'#6b2cff',fontWeight:'700',marginTop:2},people:{fontSize:15,color:'#111',fontWeight:'600'},preview:{fontSize:13,color:'#888',marginTop:3},roomMeta:{alignItems:'flex-end',justifyContent:'center',minWidth:38,gap:5},roomTime:{fontSize:11,color:'#999'},roomBadge:{minWidth:24,height:24,borderRadius:12,backgroundColor:'#ed00b3',alignItems:'center',justifyContent:'center',paddingHorizontal:6},badgeText:{color:'#fff',fontSize:11,fontWeight:'900'},chatHeadText:{flex:1,paddingHorizontal:9},chatTitle:{fontSize:15,fontWeight:'800',color:'#111'},chatSub:{fontSize:11.5,color:'#888',marginTop:2},invite:{paddingHorizontal:14,paddingBottom:7},person:{backgroundColor:'#fff',borderRadius:14,paddingHorizontal:12,paddingVertical:9,marginRight:7},personName:{fontSize:12,fontWeight:'700'},messageList:{flex:1},messages:{paddingHorizontal:14,paddingTop:8,paddingBottom:10},wrap:{marginBottom:9,alignItems:'flex-start'},sender:{fontSize:10.5,color:'#999',marginBottom:3,marginHorizontal:4},bubble:{maxWidth:'82%',backgroundColor:'#fff',borderRadius:18,paddingHorizontal:13,paddingVertical:9},mine:{backgroundColor:'#6b2cff'},mediaBubble:{padding:8},body:{fontSize:15,color:'#111',lineHeight:20},messageTime:{fontSize:9.5,color:'#aaa',marginTop:4,textAlign:'right'},messageTimeMine:{color:'rgba(255,255,255,.72)'},chatImage:{width:210,height:210,borderRadius:13,backgroundColor:'#ddd'},mediaCard:{minWidth:160,minHeight:62,flexDirection:'row',alignItems:'center',justifyContent:'center',gap:9,paddingHorizontal:10},mediaLabel:{fontSize:13,fontWeight:'800',color:'#6b2cff'},composer:{minHeight:62,paddingHorizontal:10,paddingVertical:8,backgroundColor:'#fff',flexDirection:'row',alignItems:'flex-end',gap:7,borderTopWidth:1,borderTopColor:'#eee'},attach:{width:40,height:40,borderRadius:20,backgroundColor:'#f1ecff',alignItems:'center',justifyContent:'center'},mic:{width:40,height:40,borderRadius:20,backgroundColor:'#f1ecff',alignItems:'center',justifyContent:'center'},micRecording:{backgroundColor:'#e32b45'},input:{flex:1,minHeight:40,maxHeight:110,borderRadius:19,backgroundColor:'#f2f2f5',paddingHorizontal:13,paddingTop:10,paddingBottom:9,fontSize:15,color:'#111'},send:{width:40,height:40,borderRadius:20,alignItems:'center',justifyContent:'center'},bottomWrap:{position:'absolute',left:0,right:0,bottom:0,height:78,backgroundColor:'#f6f6f8',alignItems:'center',paddingTop:6},bottom:{width:'92%',height:58,flexDirection:'row',backgroundColor:'#fff',borderRadius:29,padding:4,shadowColor:'#000',shadowOpacity:.12,shadowRadius:10,shadowOffset:{width:0,height:3},elevation:7},nav:{flex:1,alignItems:'center',justifyContent:'center',borderRadius:24},navSelected:{borderRadius:24},navText:{fontSize:10,fontWeight:'400',color:'#6b2cff',marginTop:1},navActive:{fontSize:10,fontWeight:'400',color:'#fff',marginTop:1},navBadge:{position:'absolute',right:-11,top:-7,minWidth:17,height:17,borderRadius:9,backgroundColor:'#ff1744',alignItems:'center',justifyContent:'center',paddingHorizontal:4},navAvatar:{width:24,height:24,borderRadius:12},navInitialCircle:{width:24,height:24,borderRadius:12,backgroundColor:'#ededf2',alignItems:'center',justifyContent:'center'},navInitialText:{fontSize:9,fontWeight:'900',color:'#555'}});

name: Fix bottom navigation color inversion

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-bottom-nav-colors.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Home bottom nav colors
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='src/MainApp.tsx';
          let s=fs.readFileSync(p,'utf8');

          const oldBottom="bottomNav:{position:'absolute',left:0,right:0,bottom:0,height:78,backgroundColor:'#f6f6f8',flexDirection:'row'}";
          const newBottom="bottomNav:{position:'absolute',left:0,right:0,bottom:0,height:78,backgroundColor:'#fff',flexDirection:'row'}";
          const oldInactive="navInactive:{flex:1,alignItems:'center',justifyContent:'center',backgroundColor:'#fff'}";
          const newInactive="navInactive:{flex:1,alignItems:'center',justifyContent:'center',backgroundColor:'#f6f6f8'}";

          if(!s.includes(oldBottom)) throw new Error('bottomNav style not found exactly');
          if(!s.includes(oldInactive)) throw new Error('navInactive style not found exactly');

          s=s.replace(oldBottom,newBottom).replace(oldInactive,newInactive);
          fs.writeFileSync(p,s);
          console.log('Applied exact inversion: white behind, light-grey menu cells');
          NODE
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MainApp.tsx
          git diff --cached --quiet || git commit -m "Invert bottom navigation colors correctly"
          git push

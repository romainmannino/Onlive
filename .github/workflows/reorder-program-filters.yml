name: Reorder program filters

on:
  push:
    paths:
      - '.github/workflows/reorder-program-filters.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply program filter order'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder filters
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/MainApp.tsx')
          t=p.read_text()
          old="const FILTERS=['Tous','Divertissement','Film','Série','Sport']as const;"
          new="const FILTERS=['Tous','Sport','Divertissement','Film','Série']as const;"
          if old not in t: raise SystemExit('filter anchor not found')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "onlive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/MainApp.tsx
          git commit -m "Put sport first in program filters"
          git push

name: Fix social chat v2 workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-social-chat-v2-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix anchor and retrigger
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-onlive-social-chat-v2.yml')
          s=p.read_text()
          old='style_anchor=" favoriteTopButton:{width:34,height:34,alignItems:\'center\',justifyContent:\'center\'},"'
          new='style_anchor="favoriteTopButton:{width:34,height:34,alignItems:\'center\',justifyContent:\'center\'},"'
          if old not in s:
              raise SystemExit('anchor to fix not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-onlive-social-chat-v2.yml
          git commit -m "Fix social chat v2 workflow anchor"
          git push

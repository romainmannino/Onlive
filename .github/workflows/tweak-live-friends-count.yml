name: Tweak live friends count

on:
  push:
    paths:
      - '.github/workflows/tweak-live-friends-count.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply live friends count tweaks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch live friends count
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/MainApp.tsx')
          t=p.read_text()
          old='''<View style={s.liveSectionHead}><Text style={s.sectionTitle}>Tes proches Onlive</Text><TouchableOpacity'''
          new='''<View style={s.liveSectionHead}><Text style={s.sectionTitle}>Tes proches Onlive ({liveFriends.length})</Text><TouchableOpacity'''
          if old not in t: raise SystemExit('title anchor not found')
          t=t.replace(old,new,1)
          old2='''{canChat&&<Ionicons name="chatbubble-ellipses-outline" size={19} color="#6b2cff"/>}<View style={s.onlineDot}/>'''
          new2='''{canChat&&<Ionicons name="chatbubble-ellipses-outline" size={19} color="#6b2cff"/>}'''
          if old2 not in t: raise SystemExit('online dot anchor not found')
          t=t.replace(old2,new2,1)
          p.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name "onlive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/MainApp.tsx
          git commit -m "Show live friend count and remove redundant online dot"
          git push

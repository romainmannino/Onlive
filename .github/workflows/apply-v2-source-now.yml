name: Apply Onlive V2 source now
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v2-source-now.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply V2 patches directly to source
        run: |
          node scripts/apply-onlive-v2-fixed.cjs
          node scripts/rename-tv-browsing-je-zappe.cjs
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MainApp.tsx src/Root.tsx src/ChatScreen.tsx package.json package-lock.json app.json || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Apply Onlive V2 directly to app source"
            git push
          fi

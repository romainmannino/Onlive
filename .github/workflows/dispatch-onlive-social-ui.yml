name: Dispatch Onlive social UI upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-onlive-social-ui.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Run social UI upgrade workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run onlive-social-ui-upgrade.yml --repo ${{ github.repository }} --ref main

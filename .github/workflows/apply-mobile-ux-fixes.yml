name: Apply mobile UX fixes

on:
  push:
    paths:
      - 'scripts/apply-mobile-ux-fixes.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply targeted fixes
        run: node scripts/apply-mobile-ux-fixes.mjs
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MainApp.tsx
          git commit -m "Fix auth redirect and Onlive friend tap UX"
          git push origin HEAD:main

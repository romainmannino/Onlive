name: Apply chat audio direct
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-chat-audio-direct.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Add audio messages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/ChatScreen.tsx'); s=p.read_text()
          anchor="import*as ImagePicker from'expo-image-picker';"
          if "from'expo-av'" not in s: s=s.replace(anchor,anchor+"\nimport{Audio}from'expo-av';",1)
          old="[mediaBusy,setMediaBusy]=useState(false);"
          if old not in s: raise SystemExit('media state anchor missing')
          s=s.replace(old,"[mediaBusy,setMediaBusy]=useState(false),[recording,setRecording]=useState<Audio.Recording|null>(null);",1)
          s=s.replace("async function uploadAttachment(uri:string,type:'image'|'video',name?:string,mime?:string)","async function uploadAttachment(uri:string,type:'image'|'video'|'audio',name?:string,mime?:string)",1)
          old="const ext=(name?.split('.').pop()||uri.split('.').pop()||(type==='image'?'jpg':'mp4')).replace(/[^a-zA-Z0-9]/g,'').toLowerCase();"
          new="const ext=(name?.split('.').pop()||uri.split('.').pop()||(type==='image'?'jpg':type==='video'?'mp4':'m4a')).replace(/[^a-zA-Z0-9]/g,'').toLowerCase();"
          if old not in s: raise SystemExit('ext anchor missing')
          s=s.replace(old,new,1)
          old="const contentType=mime||(type==='image'?'image/jpeg':'video/mp4');"
          new="const contentType=mime||(type==='image'?'image/jpeg':type==='video'?'video/mp4':'audio/mp4');"
          s=s.replace(old,new,1)
          anchor=" async function invite(p:KnownPerson)"
          funcs=""" async function toggleRecording(){if(!roomId||mediaBusy)return;if(recording){try{await recording.stopAndUnloadAsync();const uri=recording.getURI();setRecording(null);await Audio.setAudioModeAsync({allowsRecordingIOS:false,playsInSilentModeIOS:true});if(uri)await uploadAttachment(uri,'audio','message-onlive.m4a','audio/mp4')}catch(e:any){setRecording(null);Alert.alert('Audio impossible',e?.message||'Impossible d’envoyer cet audio.')}return}const perm=await Audio.requestPermissionsAsync();if(!perm.granted)return Alert.alert('Microphone','Autorise Onlive à utiliser le microphone pour envoyer un message audio.');try{await Audio.setAudioModeAsync({allowsRecordingIOS:true,playsInSilentModeIOS:true});const rec=new Audio.Recording();await rec.prepareToRecordAsync(Audio.RecordingOptionsPresets.HIGH_QUALITY);await rec.startAsync();setRecording(rec)}catch(e:any){Alert.alert('Microphone impossible',e?.message||'Impossible de démarrer l’enregistrement.')}}
 async function playAudio(url?:string|null){if(!url)return;try{const{sound}=await Audio.Sound.createAsync({uri:url},{shouldPlay:true});sound.setOnPlaybackStatusUpdate((st:any)=>{if(st?.didJustFinish)sound.unloadAsync().catch(()=>{})})}catch{Linking.openURL(url).catch(()=>{})}}
"""
          if anchor not in s: raise SystemExit('invite anchor missing')
          s=s.replace(anchor,funcs+anchor,1)
          old="item.message_type==='audio'?<View style={s.mediaCard}><Ionicons name=\"mic\" size={25} color={mine?'#fff':'#6b2cff'}/><Text style={[s.mediaLabel,mine&&{color:'#fff'}]}>Audio</Text></View>"
          new="item.message_type==='audio'?<TouchableOpacity onPress={()=>playAudio(item.signed_url)} style={s.mediaCard}><Ionicons name=\"play\" size={25} color={mine?'#fff':'#6b2cff'}/><Text style={[s.mediaLabel,mine&&{color:'#fff'}]}>Message audio</Text></TouchableOpacity>"
          if old not in s: raise SystemExit('audio render anchor missing')
          s=s.replace(old,new,1)
          old='<TextInput value={text} onChangeText={setText} onFocus={()=>setTimeout(()=>listRef.current?.scrollToEnd({animated:true}),100)} placeholder="Message…" style={s.input} multiline blurOnSubmit={false} autoCorrect spellCheck autoCapitalize="sentences"/><TouchableOpacity disabled={!text.trim()||mediaBusy} onPress={send} style={{opacity:text.trim()?1:.4}}>'
          new='<TextInput value={text} onChangeText={setText} onFocus={()=>setTimeout(()=>listRef.current?.scrollToEnd({animated:true}),100)} placeholder={recording?"Enregistrement audio…":"Message…"} style={s.input} multiline blurOnSubmit={false} autoCorrect spellCheck autoCapitalize="sentences" editable={!recording}/><TouchableOpacity disabled={mediaBusy} onPress={toggleRecording} style={[s.mic,recording&&s.micRecording]}><Ionicons name={recording?"stop":"mic-outline"} size={20} color={recording?"#fff":"#6b2cff"}/></TouchableOpacity><TouchableOpacity disabled={!text.trim()||mediaBusy||Boolean(recording)} onPress={send} style={{opacity:text.trim()&&!recording?1:.4}}>'
          if old not in s: raise SystemExit('composer anchor missing')
          s=s.replace(old,new,1)
          old="attach:{width:40,height:40,borderRadius:20,backgroundColor:'#f1ecff',alignItems:'center',justifyContent:'center'},input:"
          new="attach:{width:40,height:40,borderRadius:20,backgroundColor:'#f1ecff',alignItems:'center',justifyContent:'center'},mic:{width:40,height:40,borderRadius:20,backgroundColor:'#f1ecff',alignItems:'center',justifyContent:'center'},micRecording:{backgroundColor:'#e32b45'},input:"
          if old not in s: raise SystemExit('style mic anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Lock and typecheck
        run: |
          npm install --package-lock-only
          npm install
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ChatScreen.tsx package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Add photo video and audio chat messages"
          git push

<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onlive Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f5f8;color:#111}.wrap{max-width:1280px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:54px;height:54px;border-radius:16px}.muted{color:#7b7b84}.card{background:#fff;border:1px solid #e8e8ed;border-radius:22px;padding:20px;box-shadow:0 8px 28px rgba(0,0,0,.04)}.login{max-width:440px;margin:90px auto}.login input,.field{width:100%;border:1px solid #dddde5;background:#fff;border-radius:12px;padding:12px 13px;font-size:14px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:#111;color:#fff}.btn.purple{background:linear-gradient(90deg,#682cff,#ec00b5)}.btn.soft{background:#f0ecff;color:#652cff}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.kpi .v{font-size:30px;font-weight:800}.kpi .l{font-size:12px;color:#7b7b84;margin-top:5px}.section{margin-top:18px}.section h2{font-size:20px;margin:0 0 13px}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid #dddde5;border-radius:10px;padding:10px}.programs{display:flex;flex-direction:column;gap:9px;max-height:680px;overflow:auto}.program{display:grid;grid-template-columns:72px 1fr 110px 100px;gap:10px;align-items:center;border:1px solid #ececf1;border-radius:16px;padding:10px}.thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;background:#eee}.ptitle{font-weight:800}.meta{font-size:12px;color:#777;margin-top:4px}.star{font-size:12px;padding:7px 9px;border-radius:999px;background:#f1f1f5}.star.on{background:#fff0b8;color:#8b6500}.editor{position:sticky;top:18px}.editor label{display:block;font-size:12px;color:#777;margin:12px 0 5px}.editor img{width:100%;height:190px;object-fit:cover;border-radius:16px;background:#eee}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toplist{display:flex;flex-direction:column;gap:8px}.toprow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.hidden{display:none!important}.status{font-size:13px;margin-top:10px}.ok{color:#16813a}.err{color:#b00020}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.program{grid-template-columns:55px 1fr 80px}.program .editBtn{grid-column:2/4}.thumb{width:55px;height:55px}.wrap{padding:16px}}</style></head><body><div class="wrap">
<div id="login" class="card login"><div class="brand"><img src="/logo carre.png"><div><h1 style="margin:0">Onlive Admin</h1><div class="muted">Accès réservé</div></div></div><div style="height:18px"></div><input id="email" type="email" placeholder="E-mail"><div style="height:10px"></div><input id="password" type="password" placeholder="Mot de passe"><div style="height:12px"></div><button class="btn purple" style="width:100%" onclick="login()">Se connecter</button><div id="loginStatus" class="status"></div></div>
<div id="app" class="hidden"><div class="top"><div class="brand"><img src="/logo carre.png"><div><h1 style="margin:0">Onlive Admin</h1><div class="muted">Pilotage audience & programmation</div></div></div><button class="btn soft" onclick="logout()">Déconnexion</button></div>
<div class="grid"><div class="card kpi"><div id="users" class="v">–</div><div class="l">Utilisateurs</div></div><div class="card kpi"><div id="live" class="v">–</div><div class="l">Onlive maintenant</div></div><div class="card kpi"><div id="active30" class="v">–</div><div class="l">Actifs 30 jours</div></div><div class="card kpi"><div id="select30" class="v">–</div><div class="l">Sélections 30 jours</div></div><div class="card kpi"><div id="chatToday" class="v">–</div><div class="l">Messages aujourd’hui</div></div><div class="card kpi"><div id="programsToday" class="v">–</div><div class="l">Programmes aujourd’hui</div></div></div>
<div class="layout section"><div><div class="card"><div class="toolbar"><h2 style="margin:0;margin-right:auto">Programmes</h2><input id="date" type="date"><select id="filter"><option value="all">Tous</option><option>Sport</option><option>Foot</option><option>Tennis</option><option>Divertissement</option><option>Film</option><option>Série</option><option>Documentaire</option></select><button class="btn" onclick="loadPrograms()">Actualiser</button></div><div id="programList" class="programs"></div></div><div class="card section"><h2>Top programmes – 30 jours</h2><div id="topPrograms" class="toplist"></div></div></div>
<div><div class="card editor"><h2>Éditer le programme</h2><div id="emptyEdit" class="muted">Choisis un programme dans la liste.</div><div id="editBox" class="hidden"><img id="preview"><input type="hidden" id="pid"><label>Titre</label><input class="field" id="ptitle"><label>Chaîne</label><input class="field" id="pchannel"><div class="row"><div><label>Heure</label><input class="field" id="ptime" type="time"></div><div><label>Catégorie</label><input class="field" id="pcategory"></div></div><label>URL image</label><input class="field" id="pimage" placeholder="https://..."><div class="row"><div><label>Sélection du jour</label><select class="field" id="pfeatured"><option value="false">Non</option><option value="true">Oui</option></select></div><div><label>Position</label><select class="field" id="porder"><option value="">Auto</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div></div><div style="height:14px"></div><button class="btn purple" style="width:100%" onclick="saveProgram()">Enregistrer</button><div id="saveStatus" class="status"></div></div></div></div></div></div></div>
<script>
const SB_URL='https://cixheqmufmvkolljbbqc.supabase.co';const SB_KEY='sb_publishable_Ze5BdjJw9m213sjyTtbuqw_IxnXzz6J';const sb=supabase.createClient(SB_URL,SB_KEY);let programs=[];
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());document.getElementById('date').value=today();
async function login(){const s=document.getElementById('loginStatus');s.textContent='Connexion…';const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){s.textContent=error.message;s.className='status err';return}await boot()}
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){const {data:adm,error}=await sb.rpc('is_onlive_admin');if(error||!adm){await sb.auth.signOut();loginStatus.textContent='Ce compte n’est pas administrateur.';loginStatus.className='status err';return}login.classList.add('hidden');app.classList.remove('hidden');await Promise.all([loadStats(),loadPrograms()])}
async function loadStats(){const {data,error}=await sb.rpc('admin_dashboard_stats',{days_back:30});if(error)return;users.textContent=data.users_total;live.textContent=data.onlive_now;active30.textContent=data.active_users_30d;select30.textContent=data.program_selects_30d;chatToday.textContent=data.chat_messages_today;programsToday.textContent=data.programs_today;topPrograms.innerHTML=(data.top_programs||[]).map(x=>`<div class="toprow"><span>${esc(x.title)} <small class="muted">${esc(x.channel||'')}</small></span><b>${x.selections}</b></div>`).join('')||'<div class="muted">Les statistiques vont se remplir avec l’usage.</div>'}
async function loadPrograms(){const {data,error}=await sb.rpc('admin_programs',{target_date:date.value});if(error){programList.innerHTML='<div class="err">'+esc(error.message)+'</div>';return}programs=data||[];renderPrograms()}
function renderPrograms(){const f=filter.value;const rows=f==='all'?programs:programs.filter(p=>p.category===f);programList.innerHTML=rows.map(p=>`<div class="program"><img class="thumb" src="${escAttr(p.image_url||'/logo carre.png')}" onerror="this.src='/logo carre.png'"><div><div class="ptitle">${esc(p.title)}</div><div class="meta">${String(p.start_time).slice(0,5)} · ${esc(p.channel)} · ${esc(p.category||'')}</div></div><div class="star ${p.featured?'on':''}">${p.featured?'★ Sélection '+(p.featured_order||''):'☆ Standard'}</div><button class="btn editBtn" onclick="editProgram('${p.id}')">Éditer</button></div>`).join('')}
filter.onchange=renderPrograms;function editProgram(id){const p=programs.find(x=>x.id===id);if(!p)return;emptyEdit.classList.add('hidden');editBox.classList.remove('hidden');pid.value=p.id;ptitle.value=p.title||'';pchannel.value=p.channel||'';ptime.value=String(p.start_time||'').slice(0,5);pcategory.value=p.category||'';pimage.value=p.image_url||'';pfeatured.value=String(!!p.featured);porder.value=p.featured_order||'';preview.src=p.image_url||'/logo carre.png'}pimage.oninput=()=>preview.src=pimage.value||'/logo carre.png';
async function saveProgram(){saveStatus.textContent='Enregistrement…';saveStatus.className='status';const args={p_id:pid.value,p_title:ptitle.value.trim(),p_channel:pchannel.value.trim(),p_category:pcategory.value.trim(),p_start_time:ptime.value||null,p_image_url:pimage.value.trim()||null,p_featured:pfeatured.value==='true',p_featured_order:porder.value?Number(porder.value):null};const {error}=await sb.rpc('admin_update_program',args);if(error){saveStatus.textContent=error.message;saveStatus.className='status err';return}saveStatus.textContent='Enregistré dans Supabase ✓';saveStatus.className='status ok';await loadPrograms()}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escAttr(v=''){return esc(v)}
sb.auth.getSession().then(({data})=>{if(data.session)boot()});
</script></body></html>
